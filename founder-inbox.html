<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SONVIA • Founder Inbox</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    background:#0b0b0f;
    color:#fff;
    font-family:Arial,sans-serif;
}

.header{
    padding:20px;
    background:linear-gradient(
        180deg,
        #7C3AED,
        #1b132e
    );
}

.header-top{
    display:flex;
    align-items:center;
    gap:15px;
}

.back{
    color:#fff;
    text-decoration:none;
    font-size:26px;
}

.header h2{
    margin:0;
}

.container{
    padding:20px;
    padding-bottom:100px;
}

.filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:15px;
}

.filter-btn{
    flex:0 0 auto;
    width:auto;
    margin:0;
    padding:9px 14px;
    border:1px solid #333;
    border-radius:999px;
    background:#15151d;
    color:#aaa;
    font-size:13px;
}

.filter-btn.active{
    background:#7C3AED;
    border-color:#7C3AED;
    color:#fff;
}

.booking-card{
    background:#15151d;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    border:1px solid rgba(255,255,255,.05);
}

.booking-code{
    color:#B794F6;
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
}

.booking-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:8px;
}

.booking-line{
    color:#aaa;
    font-size:14px;
    margin:7px 0;
}

.booking-line strong{
    color:#fff;
}

.status{
    display:inline-block;
    margin-top:10px;
    padding:6px 12px;
    border-radius:999px;
    background:rgba(124,58,237,.18);
    color:#B794F6;
    font-size:12px;
}

.countdown{
    margin-top:12px;
    padding:10px;
    border-radius:10px;
    background:rgba(124,58,237,.10);
    color:#B794F6;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#888;
    padding:40px 10px;
}

.error{
    color:#f87171;
    text-align:center;
    padding:30px 10px;
}

.loading{
    text-align:center;
    color:#aaa;
    padding:30px 10px;
}

</style>

</head>

<body>

<div class="header">

    <div class="header-top">

        <a
            href="admin-verification.html"
            class="back"
        >
            ←
        </a>

        <h2>Founder Inbox</h2>

    </div>

</div>


<div class="container">

    <div class="filters">

        <button
            class="filter-btn active"
            data-filter="all"
        >
            All
        </button>

        <button
            class="filter-btn"
            data-filter="pending"
        >
            Pending
        </button>

        <button
            class="filter-btn"
            data-filter="confirmed"
        >
            Confirmed
        </button>

        <button
            class="filter-btn"
            data-filter="missed"
        >
            Missed
        </button>

        <button
            class="filter-btn"
            data-filter="completed"
        >
            Completed
        </button>

    </div>


    <div id="bookingsList">
    <p style="color:#aaa;text-align:center;">
        Loading bookings...
    </p>
    </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const bookingsList = document.getElementById("bookingsList");
    const filterButtons = document.querySelectorAll(".filter-btn");

    let allBookings = [];
    let currentFilter = "all";

    function showMessage(message, color = "#aaa") {
        bookingsList.innerHTML = `
            <p style="
                color:${color};
                text-align:center;
                padding:30px 10px;
            ">
                ${message}
            </p>
        `;
    }

    function renderBookings() {

        let bookings = allBookings;

        if (currentFilter !== "all") {
            bookings = allBookings.filter(
                booking => booking.status === currentFilter
            );
        }

        if (!bookings.length) {
            showMessage("No bookings found.");
            return;
        }

        bookingsList.innerHTML = "";

        bookings.forEach(booking => {

            const date = booking.booking_date
                ? new Date(booking.booking_date)
                : null;

            const dateText = date
                ? date.toLocaleDateString()
                : "No date";

            const timeText = booking.session_time || "No time";

            const amount = Number(booking.amount || 0)
                .toLocaleString();

            const card = document.createElement("div");

            card.style.cssText = `
                background:#111116;
                border:1px solid #29292f;
                border-radius:16px;
                padding:18px;
                margin-bottom:14px;
            `;

            card.innerHTML = `
                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:10px;
                ">
                    <strong style="color:#fff;font-size:17px;">
                        ${booking.booking_code || "No booking code"}
                    </strong>

                    <span style="
                        color:#9F67FF;
                        font-size:13px;
                        font-weight:bold;
                        text-transform:capitalize;
                    ">
                        ${booking.status || "unknown"}
                    </span>
                </div>

                <p style="color:#ddd;margin:12px 0 5px;">
                    ${booking.service_name || "Studio Session"}
                </p>

                <p style="color:#999;margin:5px 0;">
                    Amount: ₦${amount}
                </p>

                <p style="color:#999;margin:5px 0;">
                    Session: ${dateText} • ${timeText}
                </p>

                <p style="color:#777;margin:5px 0;font-size:13px;">
                    Artist ID: ${booking.artist_id || "Unknown"}
                </p>

                <p style="color:#777;margin:5px 0;font-size:13px;">
                    Producer ID: ${booking.producer_id || "Unknown"}
                </p>
            `;

            bookingsList.appendChild(card);
        });
    }


    async function loadFounderInbox() {

        try {

            showMessage("Checking Founder access...", "#9F67FF");

            if (!window.supabase) {
                showMessage(
                    "Supabase library failed to load.",
                    "#ef4444"
                );
                return;
            }

            /*
             * KEEP YOUR EXISTING SUPABASE URL AND KEY HERE.
             */
            const SUPABASE_URL = "https://kuhynelblomedbyjsqhas.supabase.co";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1aHluZWxib21lZGJ5anNxaGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NTEyMzYsImV4cCI6MjEwMjIyNzIzNn0.V0AvGoj1_qG2IspiSAyoOnqaSTNlQO8qoS_vaV7ZNl8
‎";

            const client = window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


            const {
                data: {
                    user
                },
                error: authError
            } = await client.auth.getUser();


            if (authError) {
                showMessage(
                    "Authentication error: " + authError.message,
                    "#ef4444"
                );
                return;
            }


            if (!user) {
                showMessage(
                    "You are not logged in.",
                    "#ef4444"
                );
                return;
            }


            showMessage(
                "Verifying Founder access...",
                "#9F67FF"
            );


            const {
                data: profile,
                error: profileError
            } = await client
                .from("profiles")
                .select("is_admin")
                .eq("id", user.id)
                .maybeSingle();


            if (profileError) {
                showMessage(
                    "Profile error: " + profileError.message,
                    "#ef4444"
                );
                return;
            }


            if (!profile || profile.is_admin !== true) {
                showMessage(
                    "Founder access required.",
                    "#ef4444"
                );
                return;
            }


            showMessage(
                "Loading SONVIA bookings...",
                "#9F67FF"
            );


            const {
                data: bookings,
                error: bookingsError
            } = await client
                .from("bookings")
                .select(`
                    id,
                    booking_code,
                    artist_id,
                    producer_id,
                    service_name,
                    amount,
                    sonvia_fee,
                    producer_amount,
                    booking_date,
                    session_time,
                    status,
                    created_at
                `)
                .order("created_at", {
                    ascending: false
                });


            if (bookingsError) {
                showMessage(
                    "Bookings error: " + bookingsError.message,
                    "#ef4444"
                );
                return;
            }


            allBookings = bookings || [];

            renderBookings();

        } catch (error) {

            console.error(
                "Founder Inbox error:",
                error
            );

            showMessage(
                "Founder Inbox error: " +
                (error.message || error),
                "#ef4444"
            );
        }
    }


    filterButtons.forEach(button => {

        button.addEventListener("click", () => {

            filterButtons.forEach(btn => {
                btn.classList.remove("active");
            });

            button.classList.add("active");

            currentFilter =
                button.dataset.filter || "all";

            renderBookings();
        });

    });


    loadFounderInbox();

});
</script>
    
</body>
</html>
