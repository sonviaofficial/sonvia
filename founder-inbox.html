<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SONVIA • Founder Inbox</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    background:#0b0b0f;
    color:#fff;
    font-family:Arial,sans-serif;
}

.header{
    padding:20px;
    background:linear-gradient(
        180deg,
        #7C3AED,
        #1b132e
    );
}

.header-top{
    display:flex;
    align-items:center;
    gap:15px;
}

.back{
    color:#fff;
    text-decoration:none;
    font-size:26px;
}

.header h2{
    margin:0;
}

.container{
    padding:20px;
    padding-bottom:100px;
}

.filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:15px;
}

.filter-btn{
    flex:0 0 auto;
    width:auto;
    margin:0;
    padding:9px 14px;
    border:1px solid #333;
    border-radius:999px;
    background:#15151d;
    color:#aaa;
    font-size:13px;
}

.filter-btn.active{
    background:#7C3AED;
    border-color:#7C3AED;
    color:#fff;
}

.booking-card{
    background:#15151d;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    border:1px solid rgba(255,255,255,.05);
}

.booking-code{
    color:#B794F6;
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
}

.booking-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:8px;
}

.booking-line{
    color:#aaa;
    font-size:14px;
    margin:7px 0;
}

.booking-line strong{
    color:#fff;
}

.status{
    display:inline-block;
    margin-top:10px;
    padding:6px 12px;
    border-radius:999px;
    background:rgba(124,58,237,.18);
    color:#B794F6;
    font-size:12px;
}

.countdown{
    margin-top:12px;
    padding:10px;
    border-radius:10px;
    background:rgba(124,58,237,.10);
    color:#B794F6;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#888;
    padding:40px 10px;
}

.error{
    color:#f87171;
    text-align:center;
    padding:30px 10px;
}

.loading{
    text-align:center;
    color:#aaa;
    padding:30px 10px;
}

</style>

</head>

<body>

<div class="header">

    <div class="header-top">

        <a
            href="admin-verification.html"
            class="back"
        >
            ←
        </a>

        <h2>Founder Inbox</h2>

    </div>

</div>


<div class="container">

    <div class="filters">

        <button
            class="filter-btn active"
            data-filter="all"
        >
            All
        </button>

        <button
            class="filter-btn"
            data-filter="pending"
        >
            Pending
        </button>

        <button
            class="filter-btn"
            data-filter="confirmed"
        >
            Confirmed
        </button>

        <button
            class="filter-btn"
            data-filter="missed"
        >
            Missed
        </button>

        <button
            class="filter-btn"
            data-filter="completed"
        >
            Completed
        </button>

    </div>


    <div id="bookingsList">
<p style="color:#7C3AED;font-weight:bold;">
TEST VERSION 999
</p>
        <div class="loading">
            Loading bookings...
        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const bookingsList =
document.getElementById("bookingsList");


/* =====================================================
   STEP 1 — CHECK SUPABASE LIBRARY
   ===================================================== */

if(!window.supabase){

    bookingsList.innerHTML = `
        <div class="error">
            Supabase library failed to load.
        </div>
    `;

    throw new Error(
        "Supabase library not loaded"
    );
}


/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://kuhynelblomedbyjsqhas.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1aHluZWxib21lZGJ5anNxaGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NTEyMzYsImV4cCI6MjEwMjIyNzIzNn0.V0AvGoj1_qG2IspiSAyoOnqaSTNlQO8qoS_vaV7ZNl8";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   STEP 2 — START
   ===================================================== */

bookingsList.innerHTML = `
    <div class="loading">
        Connecting to SONVIA...
    </div>
`;


async function loadFounderInbox(){

    try{

        /* ---------------------------------------------
           CHECK LOGIN
        --------------------------------------------- */

        bookingsList.innerHTML = `
            <div class="loading">
                Checking Founder account...
            </div>
        `;


        const {
            data:{
                user
            },
            error:userError
        } =
        await supabase.auth.getUser();


        if(userError){

            throw new Error(
                "Auth error: " +
                userError.message
            );

        }


        if(!user){

            window.location.href =
            "login.html";

            return;

        }


        /* ---------------------------------------------
           CHECK ADMIN
        --------------------------------------------- */

        bookingsList.innerHTML = `
            <div class="loading">
                Verifying Founder access...
            </div>
        `;


        const {
            data:profile,
            error:profileError
        } =
        await supabase
        .from("profiles")
        .select("is_admin")
        .eq("id",user.id)
        .single();


        if(profileError){

            throw new Error(
                "Profile error: " +
                profileError.message
            );

        }


        if(!profile || profile.is_admin !== true){

            bookingsList.innerHTML = `
                <div class="error">
                    Founder access only.
                </div>
            `;

            return;

        }


        /* ---------------------------------------------
           LOAD BOOKINGS
        --------------------------------------------- */

        bookingsList.innerHTML = `
            <div class="loading">
                Loading SONVIA bookings...
            </div>
        `;


        const {
            data:bookings,
            error:bookingError
        } =
        await supabase
        .from("bookings")
        .select(`
            id,
            booking_code,
            artist_id,
            producer_id,
            service_name,
            amount,
            sonvia_fee,
            producer_amount,
            booking_date,
            session_time,
            status,
            created_at
        `)
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(bookingError){

            throw new Error(
                "Bookings error: " +
                bookingError.message
            );

        }


        /* ---------------------------------------------
           NO BOOKINGS
        --------------------------------------------- */

        if(!bookings || bookings.length === 0){

            bookingsList.innerHTML = `
                <div class="empty">
                    No bookings found.
                </div>
            `;

            return;

        }


        /* ---------------------------------------------
           DISPLAY BOOKINGS
        --------------------------------------------- */

        bookingsList.innerHTML = "";


        bookings.forEach(
            booking => {

                const card =
                document.createElement(
                    "div"
                );


                card.className =
                "booking-card";


                const date =
                booking.booking_date
                ?
                new Date(
                    booking.booking_date
                ).toLocaleDateString()
                :
                "Date not set";


                card.innerHTML = `

                    <div class="booking-code">
                        ${
                            booking.booking_code ||
                            "No reference"
                        }
                    </div>

                    <div class="booking-title">
                        ${
                            booking.service_name ||
                            "Studio Session"
                        }
                        •
                        ${
                            booking.status
                        }
                    </div>

                    <div class="booking-line">
                        Artist ID:
                        <strong>
                            ${booking.artist_id}
                        </strong>
                    </div>

                    <div class="booking-line">
                        Producer ID:
                        <strong>
                            ${booking.producer_id}
                        </strong>
                    </div>

                    <div class="booking-line">
                        Amount:
                        <strong>
                            ₦${
                                Number(
                                    booking.amount || 0
                                ).toLocaleString()
                            }
                        </strong>
                    </div>

                    ${
                        booking.status ===
                        "confirmed"
                        ?
                        `
                        <div class="booking-line">
                            Session:
                            <strong>
                                ${date}
                                ${
                                    booking.session_time
                                    ?
                                    " • " +
                                    booking.session_time
                                    :
                                    ""
                                }
                            </strong>
                        </div>
                        `
                        :
                        ""
                    }

                    ${
                        booking.status ===
                        "pending"
                        ?
                        `
                        <div class="countdown">
                            ⏱ Pending booking
                        </div>
                        `
                        :
                        ""
                    }

                    <div class="status">
                        ${booking.status}
                    </div>

                `;


                bookingsList.appendChild(
                    card
                );

            }
        );

    }catch(error){

        console.error(
            "Founder Inbox:",
            error
        );


        bookingsList.innerHTML = `
            <div class="error">

                <strong>
                    Founder Inbox Error
                </strong>

                <br><br>

                ${error.message}

            </div>
        `;

    }

}


loadFounderInbox();

</script>
    <script>
document.getElementById("bookingsList").innerHTML = `
<p style="color:#7C3AED;font-weight:bold;">
JAVASCRIPT IS RUNNING
</p>
`;
    </script>
    
</body>
</html>
