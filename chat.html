<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat • SONVIA</title>
<link rel="stylesheet" href="style.css">
<style>
body{margin:0;background:#0b0b0f;color:#fff;font-family:Arial,sans-serif;}
.header{
padding:20px;
display:flex;
align-items:center;
gap:12px;
border-bottom:1px solid #222;
background:#111;
}
.chat-area{
padding:20px;
}
.card{
background:#15151d;
padding:18px;
border-radius:18px;
}
.rule{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #222;
}
.input{
position:fixed;
bottom:0;
left:0;
right:0;
padding:16px;
background:#111;
border-top:1px solid #222;
}
input{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#1b1b25;
color:white;
}
</style>
</head>
<body>

<div class="header">
<a href="artist-dashboard.html" style="color:white;text-decoration:none;">←</a>
<div>
<h3 style="margin:0;">Chat</h3>
<small style="color:#888;">Private Messages</small>
</div>
</div>

<div class="chat-area">

<div class="card">

<h4 style="margin-top:0;">Coming Soon</h4>

<p style="color:#bbb;">
SONVIA secure messaging is currently under development.
</p>

<div class="rule"><span>Images</span><span>✅</span></div>
<div class="rule"><span>Voice Notes</span><span>✅</span></div>
<div class="rule"><span>Links</span><span>❌</span></div>
<div class="rule"><span>Phone Numbers</span><span>❌</span></div>
<div class="rule"><span>Videos</span><span>❌</span></div>
<div class="rule" style="border:none;"><span>Video Calls</span><span>❌</span></div>

</div>

</div>

<div class="input">
<input type="text" placeholder="Secure chat coming soon..." disabled>
</div>

</body>
</html>
