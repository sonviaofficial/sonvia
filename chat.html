<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONVIA Chat</title>
<link rel="stylesheet" href="style.css">

<style>
.chat-page{
background:#050816;
color:white;
min-height:100vh;
display:flex;
flex-direction:column;
}

.chat-header{
display:flex;
align-items:center;
gap:12px;
padding:16px;
background:#111827;
border-bottom:1px solid #243041;
}

.chat-header a{
color:white;
text-decoration:none;
font-size:15px;
}

.chat-avatar{
width:42px;
height:42px;
border-radius:50%;
background:#333;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.chat-header .name{
display:flex;
align-items:center;
gap:6px;
font-weight:600;
}

.chat-header .verify{
width:16px;
height:16px;
background:#7C3AED;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
}

.messages{
flex:1;
padding:18px;
display:flex;
flex-direction:column;
gap:14px;
overflow-y:auto;
}

.msg{
max-width:75%;
padding:12px 14px;
border-radius:16px;
}

.received{
background:#1f2937;
align-self:flex-start;
}

.sent{
background:#7C3AED;
align-self:flex-end;
}

.lock-card{
background:#111827;
border:1px solid #243041;
border-radius:18px;
padding:16px;
margin:10px;
display:none;
}

.lock-card.show{
display:block;
}

.lock-card button{
background:#7C3AED;
color:white;
font-weight:600;
margin-top:12px;
}

.chat-input{
display:flex;
gap:10px;
padding:14px;
background:#111827;
border-top:1px solid #243041;
}

.chat-input input{
flex:1;
padding:14px;
background:#1f2937;
border:none;
border-radius:999px;
color:white;
}

.chat-input button{
width:auto;
padding:0 22px;
background:#22c55e;
color:black;
font-weight:600;
}

.not-sent{
font-size:12px;
color:#ef4444;
margin-top:-8px;
align-self:flex-end;
display:none;
}
</style>

</head>

<body>

<div class="chat-page">

<div class="chat-header">

<a id="backBtn" href="#">← Back</a>

<div class="chat-avatar" id="profilePic">S</div>

<div>

<div class="chat-user">
  <div class="top-row">
    <row gap=1 align=center>
    <h3 id="chatName">Loading...</h3>
      <span id="verifiedBadge" style="display:none;"></span>
    </row>
    <span id="chatStatus">Active</span>
  </div>
<p id="chatUsername">@loading</p>
</div>

</div>

</div>

<div class="messages" id="messages">


</div>

<div class="not-sent" id="notSent">
Not sent — Follow this person to continue chatting.
</div>

<div class="lock-card" id="lockCard">

<h3>🔒 Chat Locked</h3>

<p>
You have used your one free message.
Follow this person to continue chatting.
</p>

<button id="followBtn">
Follow & Unlock Chat
</button>

</div>

<div class="chat-input">

<input
id="messageInput"
placeholder="Type a message...">

<button id="sendBtn">
Send
</button>

</div>

</div>

<script type="module">
import { supabase } from "./supabase.js";

 function formatLastSeen(time){
  const diff = Math.floor((Date.now() - new Date(time))/60000);

  if(diff < 1) return "Off now";
  if(diff < 60) return `Off ${diff}m`;

  const h = Math.floor(diff/60);
  return `Off ${h}h`;
}

function updateChatStatus(profile){
  const status = document.getElementById("chatStatus");

  if(profile.is_online){
    status.textContent = "Active";
    status.style.color = "#9F67FF";
  }else{
    status.textContent = formatLastSeen(profile.last_seen);
    status.style.color = "#8b8b8b";
  }
     }
const messages=document.getElementById("messages");
const input=document.getElementById("messageInput");
const send=document.getElementById("sendBtn");
const lock=document.getElementById("lockCard");
const follow=document.getElementById("followBtn");
const notSent=document.getElementById("notSent");

let followed=false;
let freeUsed=false;


 const {
  data: { user }
} = await supabase.auth.getUser();

if (!user) {
  window.location.href = "login.html";
}
  const currentUserId = user.id;

await supabase
  .from("profiles")
  .update({
    is_online: true,
    last_seen: new Date().toISOString()
  })
  .eq("id", user.id);


// User we're chatting with
const chatUserId = new URLSearchParams(window.location.search).get("user");
  document.getElementById("backBtn").href =
  "messages.html";
// Load the person we're chatting with
const { data: chatProfile } = await supabase
  .from("profiles")
  .select("username, full_name, avatar_url, is_verified, is_online, last_seen, role")
  .eq("id", chatUserId)
  .single();

if (chatProfile) {
  document.getElementById("chatName").textContent =
  chatProfile.full_name ||
  chatProfile.username ||
  (chatProfile.role === "producer" ? "Producer" : "Artist");

  const usernameEl = document.getElementById("chatUsername");

  if (chatProfile.username) {
    usernameEl.textContent = "@" + chatProfile.username;
    usernameEl.style.display = "block";
  } else {
    usernameEl.style.display = "none";
  }

  if (chatProfile.avatar_url) {
    document.getElementById("profilePic").innerHTML =
      `<img src="${chatProfile.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
  } else {
    document.getElementById("profilePic").textContent =
      (chatProfile.username || chatProfile.full_name || "S")
        .charAt(0)
        .toUpperCase();
  }

  const badge = document.getElementById("verifiedBadge");

  if (chatProfile.is_verified) {
    badge.style.display = "inline-flex";
    badge.innerHTML =
      `<img src="images/sonvia-verified.png" style="width:15px;height:15px;">`;
  } else {
    badge.style.display = "none";
  }

  updateChatStatus(chatProfile);
  }
if (!chatUserId) {
  window.location.href = "messages.html";
}

// Create or find conversation
async function getOrCreateConversation(){

  if(!chatUserId){
    console.error("No chat user ID provided.");
    return null;
  }

  // Check if conversation already exists
  const { data: existing, error: findError } =
    await supabase
      .from("conversations")
      .select("id,user_one_id,user_two_id,created_at")
      .or(
        `and(user_one_id.eq.${currentUserId},user_two_id.eq.${chatUserId}),and(user_one_id.eq.${chatUserId},user_two_id.eq.${currentUserId})`
      )
      .maybeSingle();

  if(findError){
    console.error("Conversation lookup error:", findError);
    return null;
  }

  if(existing){
    console.log("Existing conversation:", existing.id);
    return existing.id;
  }

  // Create a new conversation
  const { data: created, error: createError } =
    await supabase
      .from("conversations")
      .insert({
        user_one_id: currentUserId,
        user_two_id: chatUserId
      })
      .select("id,user_one_id,user_two_id,created_at")
      .single();

  if(createError){
    console.error("Conversation creation error:", createError);
    return null;
  }

  console.log("Conversation created:", created.id);

  return created.id;
}

const conversationId = await getOrCreateConversation();

console.log("Current conversation ID:", conversationId);

document.getElementById("profilePic")
.addEventListener("click", () => {
  window.location.href = `profile.html?id=${chatUserId}`;
});

send.addEventListener("click", async () => {

const text = input.value.trim();

if (!text || !conversationId) return;

if (!followed && freeUsed) {
    notSent.style.display = "block";
    return;
}

const { error } = await supabase
    .from("messages")
    .insert({
        conversation_id: conversationId,
        sender_id: currentUserId,
        message_type: "text",
        message_text: text,
        file_url: null
    });

if (error) {
    console.error(error);
    return;
}

input.value = "";

if (!followed && !freeUsed) {
    freeUsed = true;
    lock.classList.add("show");
}

});

follow.addEventListener("click",()=>{

followed=true;
lock.classList.remove("show");
notSent.style.display="none";

alert("Chat unlocked.");

});
window.addEventListener("beforeunload", async () => {
  await supabase
    .from("profiles")
    .update({
      is_online: false,
      last_seen: new Date().toISOString()
    })
    .eq("id", user.id);
});
 
</script>

</body>
</html>
