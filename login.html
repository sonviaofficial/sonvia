<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONVIA – Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>SONVIA</h1>
    <p>Login to your account</p>
</header>

<main>
    <section>

        <h2>Welcome Back</h2>

        <form id="loginForm">

            <input type="email"
                   id="email"
                   placeholder="Email Address"
                   required>

            <input type="password"
                   id="password"
                   placeholder="Password"
                   required>
            <a href="forgot-password.html" class="forgot-password">
    Forgot Password?
            </a>

            <button type="submit">
                Login
            </button>

        </form>

    </section>
</main>

<script type="module">

import { supabase } from './supabase.js';

document.getElementById('loginForm')
    .addEventListener('submit', async function (e) {

    e.preventDefault();

    const email =
        document.getElementById('email')
            .value
            .trim();

    const password =
        document.getElementById('password')
            .value;

    const { data, error } =
        await supabase.auth.signInWithPassword({
            email,
            password
        });

    if (error) {

        alert('❌ ' + error.message);

        return;
    }

    const user = data.user;

    if (!user) {

        alert('❌ Login failed.');

        return;
    }

    // Get user profile
    const { data: profile, error: profileError } =
        await supabase
            .from('profiles')
            .select('role')
            .eq('id', user.id)
            .single();

    if (profileError || !profile) {

        alert('❌ Could not load your profile.');

        return;
    }

    // Keep user logged in locally
    localStorage.setItem('sonviaLoggedIn', 'true');
    localStorage.setItem('sonviaUserRole', profile.role);

    alert('✅ Login successful!');

    // Redirect by role
    if (profile.role === 'producer') {

        window.location.href = 'dashboard.html';

    } else {

        window.location.href = 'artist-dashboard.html';
    }

});

</script>
</body>
</html>
