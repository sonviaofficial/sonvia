<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome • SONVIA</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b0b0f;
color:white;
}

.container{

min-height:100vh;

display:flex;

flex-direction:column;

justify-content:space-between;

background:linear-gradient(180deg,#7C3AED,#0b0b0f);

padding:40px 24px;

box-sizing:border-box;

}

.top{

text-align:center;

margin-top:30px;

}

.logo{

font-size:40px;

font-weight:700;

letter-spacing:2px;

margin:0;

}

.subtitle{

margin-top:14px;

color:#E9D8FD;

font-size:17px;

line-height:1.6;

}

.illustration{

display:flex;

justify-content:center;

align-items:center;

margin:20px 0;

}

.orb{

width:180px;

height:180px;

border-radius:50%;

background:
radial-gradient(circle at 30% 30%, #B794F6 0%, #7C3AED 35%, #3B0A73 70%, #12051F 100%);

box-shadow:
0 0 35px rgba(124,58,237,.45),
0 0 70px rgba(124,58,237,.25);

animation:float 4s ease-in-out infinite;

position:relative;

overflow:hidden;

}

.orb::before{

content:"";

position:absolute;

width:140px;

height:140px;

border-radius:50%;

background:rgba(255,255,255,.08);

top:18px;

left:20px;

filter:blur(5px);

}

@keyframes float{

0%,100%{transform:translateY(0);}
50%{transform:translateY(-8px);}

}

.actions{

display:flex;

flex-direction:column;

gap:14px;

margin-bottom:25px;

}

.btn{

display:flex;

justify-content:center;

align-items:center;

padding:16px;

border-radius:999px;

text-decoration:none;

font-size:16px;

font-weight:600;

transition:.25s ease;

}

.btn-primary{

background:#7C3AED;

color:white;

}

.btn-secondary{

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.12);

color:white;

}

.btn:active{

transform:scale(.98);

}

.back{

text-align:center;

color:#B8B8B8;

font-size:13px;

text-decoration:none;

margin-top:5px;

}

</style>

</head>

<body>

<div class="container">

<div class="top">

<h1 class="logo">SONVIA</h1>

<p class="subtitle">

Welcome to the home of artists and producers.

</p>

</div>

<div class="illustration">

<div class="orb"></div>

</div>

<div class="actions">

<a href="login.html" class="btn btn-primary">
Login
</a>

<a href="artist-register.html" class="btn btn-secondary">
Create Artist Account
</a>

<a href="producer-register.html" class="btn btn-secondary">
Create Producer Account
</a>

<a href="index.html" class="back">
← Back to Get Started
</a>

</div>

</div>

<script>

if("serviceWorker" in navigator){

window.addEventListener("load",function(){

navigator.serviceWorker.register("./service-worker.js");

});

}

</script>

</body>
</html>
