<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONVIA – Artist Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>SONVIA</h1>
    <p>Create Artist Account</p>
</header>

<main>
    <section>
        <h2>Artist Registration</h2>

        <form id="artistForm">

            <input type="text" id="fullName" placeholder="Full Name" required>

            <input type="text" id="artistName" placeholder="Artist Name" required>

            <input type="email" id="email" placeholder="Email Address" required>

            <input type="password" id="password" placeholder="Password" required>

            <button type="submit">
                Create Artist Account
            </button>

        </form>
    </section>
</main>

<script type="module">

import { supabase } from './supabase.js';

document.getElementById('artistForm').addEventListener('submit', async function (e) {

    e.preventDefault();

    const fullName = document.getElementById('fullName').value.trim();
    const artistName = document.getElementById('artistName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
            emailRedirectTo: 'https://sonviaofficial.github.io/sonvia/'
        }
    });

    if (error) {
        alert('❌ ' + error.message);
        return;
    }

    const user = data.user;

    if (user) {
        await supabase.from('profiles').insert({
            id: user.id,
            role: 'artist',
            full_name: fullName,
            artist_name: artistName,
            email: email
        });
    }

    alert('📧 Verification email sent! Please check your email before logging in.');

    window.location.href = 'login.html';
});

</script>
</body>
</html>
