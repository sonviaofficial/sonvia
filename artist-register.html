<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONVIA – Artist Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SONVIA</h1>
        <p>Create Artist Account</p>
    </header>

    <script>
document.querySelector("form").addEventListener("submit", function(e) {
    e.preventDefault();

    // Keep artist logged in
    localStorage.setItem("sonviaLoggedIn", "true");
    localStorage.setItem("sonviaUserRole", "artist");

    alert("🎉 Artist account created successfully!");

    // Open artist dashboard immediately
    window.location.href = "artist-dashboard.html";
});
    </script>
    window.location.href = "artist-dashboard.html";
}
</script>
</body>
</html>
