<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONVIA – Artist Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>SONVIA</h1>
    <p>Create Artist Account</p>
</header>

<main>
    <section>

        <h2>Artist Registration</h2>

        <form id="artistForm">

            <input
                type="text"
                id="fullName"
                placeholder="Full Name"
                required
            >

            <input
                type="text"
                id="artistName"
                placeholder="Artist Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit" id="registerButton">
                Create Artist Account
            </button>

        </form>

    </section>
</main>

<script type="module">

import { supabase } from './supabase.js';

const artistForm =
    document.getElementById('artistForm');

const registerButton =
    document.getElementById('registerButton');


artistForm.addEventListener('submit', async function (e) {

    e.preventDefault();

    const fullName =
        document.getElementById('fullName')
            .value
            .trim();

    const artistName =
        document.getElementById('artistName')
            .value
            .trim();

    const email =
        document.getElementById('email')
            .value
            .trim();

    const password =
        document.getElementById('password')
            .value;


    if (!fullName || !artistName || !email || !password) {

        alert('❌ Please complete all fields.');

        return;
    }


    registerButton.disabled = true;
    registerButton.textContent = 'Creating account...';


    try {

        // CREATE AUTH ACCOUNT
        const { data, error } = await supabase.auth.signUp({
    email,
    password,
    options: {
        emailRedirectTo: 'https://sonviaofficial.github.io/sonvia/',
        data: {
            role: 'artist'
        }
    }
});


        if (error) {

            throw error;

        }


        const user = data.user;


        if (!user) {

            throw new Error(
                'SONVIA could not create your account.'
            );

        }

        // EVERYTHING SUCCESSFUL
        alert(
            '✅ SONVIA artist account created successfully!\n\n' +
            '📧 A confirmation email has been sent to:\n' +
            email +
            '\n\n' +
            'Please confirm your email before logging in.'
        );


        window.location.href =
            'login.html';


    } catch (error) {

        console.error(
            'Artist registration error:',
            error
        );

        alert(
            '❌ ' + error.message
        );

        registerButton.disabled = false;

        registerButton.textContent =
            'Create Artist Account';

    }

});

</script>

</body>
</html>
