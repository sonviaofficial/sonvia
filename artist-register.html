<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONVIA – Artist Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>SONVIA</h1>
    <p>Create Artist Account</p>
</header>

<main>
    <section>

        <h2>Artist Registration</h2>

        <form id="artistForm">

            <input
                type="text"
                id="fullName"
                placeholder="Full Name"
                required
            >

            <input
                type="text"
                id="artistName"
                placeholder="Artist Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit" id="registerButton">
                Create Artist Account
            </button>

        </form>

    </section>
</main>

<script type="module">
import { supabase } from './supabase.js';

const form = document.getElementById('artistForm');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const fullName = document.getElementById('fullName').value.trim();
  const artistName = document.getElementById('artistName').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: 'https://sonviaofficial.github.io/sonvia/login.html',
        data: {
          role: 'artist',
          full_name: fullName,
          artist_name: artistName
        }
      }
    });

    if (error) throw error;

    const user = data.user;

    if (user) {
      const { error: profileError } = await supabase
        .from('profiles')
        .upsert({
          id: user.id,
          full_name: fullName,
          artist_name: artistName,
          role: 'artist',
          avatar_url: null,
          created_at: new Date().toISOString()
        });

      if (profileError) throw profileError;
    }

    alert("✅ Artist account created successfully. Verify your email before logging in.");
    window.location.href = "login.html";

  } catch (err) {
    alert("❌ " + err.message);
  }
});
</script>


</body>
</html>
