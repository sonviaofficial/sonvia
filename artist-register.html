<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONVIA – Artist Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SONVIA</h1>
        <p>Create Artist Account</p>
    </header>

    <main>
        <section>
            <h2>Artist Registration</h2>

            <form id="artistForm">
                <input type="text" id="fullName" placeholder="Full Name" required>
                <input type="text" id="artistName" placeholder="Artist Name" required>
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>

                <button type="submit">Create Artist Account</button>
            </form>
        </section>
    </main>

    <script>
    document.getElementById("artistForm").addEventListener("submit", function(e) {
        e.preventDefault();

        // Save artist information
        const artistData = {
            fullName: document.getElementById("fullName").value,
            artistName: document.getElementById("artistName").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        };

        localStorage.setItem("sonviaArtist", JSON.stringify(artistData));

        // Keep artist logged in
        localStorage.setItem("sonviaLoggedIn", "true");
        localStorage.setItem("sonviaUserRole", "artist");

        alert("🎉 Artist account created successfully!");

        // Open artist dashboard immediately
        window.location.href = "artist-dashboard.html";
    });
    </script>

</body>
</html>
