<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONVIA Profile</title>
<link rel="stylesheet" href="style.css">

<style>

.profile-page{
background:#050816;
color:white;
min-height:100vh;
padding-bottom:100px;
}

.profile-header{
background:linear-gradient(180deg,#7C3AED,#1b132e);
padding:18px 20px 28px;
border-bottom-left-radius:28px;
border-bottom-right-radius:28px;
position:relative;
}

.profile-header a{
position:absolute;
left:18px;
top:18px;
color:white;
text-decoration:none;
font-size:15px;
}

.profile-header h1{
text-align:center;
margin-top:18px;
font-size:30px;
}

.profile-top{
display:flex;
align-items:flex-start;
gap:16px;
}

.profile-top>div{
display:flex;
flex-direction:column;
flex:1;
min-width:0;
}

.name-row{
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;
}
  
#profileUsername{
display:block;
margin-top:4px;
font-size:18px;
color:#d1d5db;
word-break:break-word;
}

.role{
margin-top:6px;
color:#9ca3af;
word-break:break-word;
}

#profileBio{
margin:0;
word-break:break-word;
line-height:1.5;
}

.profile-avatar{
width:86px;
height:86px;
border-radius:50%;
object-fit:cover;
border:3px solid #7C3AED;
cursor:pointer;
}

.name-row{
display:flex;
align-items:center;
gap:8px;
}

.verified-pill{
display:inline-flex;
align-items:center;
gap:6px;
margin-top:8px;
padding:6px 12px;
border-radius:999px;
background:rgba(124,58,237,.15);
border:1px solid #7C3AED;
font-size:13px;
}

.role{
margin-top:6px;
color:#9ca3af;
}

.bio-card{
background:#111827;
padding:18px;
border-radius:20px;
margin-top:24px;
clear:both;
}

.stats{
display:flex;
justify-content:space-around;
margin-top:22px;
text-align:center;
}

.stats strong{
display:block;
font-size:20px;
}

.stats span{
color:#9ca3af;
font-size:13px;
}

.profile-actions{
display:flex;
gap:12px;
margin-top:22px;
}

.follow-btn,
.chat-btn{
flex:1;
font-weight:600;
}

.chat-btn{
background:transparent;
border:1px solid #7C3AED;
color:white;
}

.song-card{
margin-top:24px;
background:#111827;
padding:18px;
border-radius:20px;
}

.song{
padding:14px 0;
border-bottom:1px solid #222;
}

.song:last-child{
border-bottom:none;
}

.following{
background:#2a1a55;
}

</style>

</head>

<body>

<div class="profile-page">

<div class="profile-header">

<a id="profileBack" href="#">← Back</a>

<h1>Profile</h1>

</div>

<div class="profile-content">
<div class="profile-top">

  <img
  id="profileAvatar"
  class="profile-avatar"
  src="https://placehold.co/86x86/333/fff?text=F">

<input
  type="file"
  id="avatarInput"
  accept="image/*"
  style="display:none;">

<div>
  <div class="name-row">
    <h2 id="profileName">Loading...</h2>
  </div>

    <div id="profileUsername">@loading</div>

    <div class="role">Artist • Ikorodu, Lagos</div>

    <div class="verified-pill" id="verifiedBadge" style="display:none;">
  <div class="verify-dot">✓</div>
  Verified
    </div>

  </div>

</div>

<div class="bio-card">
  <p id="profileBio">Loading profile...</p>
</div>

<div class="stats">

<div>

<strong id="followersCount">0</strong>

<span>Followers</span>

</div>

<div>

<strong id="followingCount">0</strong>

<span>Following</span>

</div>

</div>

<div class="profile-actions">

<button id="followBtn" class="follow-btn">
Follow
</button>

<button id="chatBtn" class="chat-btn">
Chat
</button>

</div>

<div class="song-card" id="songCard" style="display:none;">

<h3>Latest Songs</h3>

<div class="song">

<strong>One Sec</strong>

<div style="color:#9ca3af;font-size:13px;">
Afrobeats
</div>

</div>

<div class="song">

<strong>Still Standing</strong>

<div style="color:#9ca3af;font-size:13px;">
Afrobeats
</div>

</div>

<div class="song">

<strong>Angel On My Side</strong>

<div style="color:#9ca3af;font-size:13px;">
Afrobeats
</div>

</div>

</div>

</div>

</div>

<script type="module">
import { supabase } from "./supabase.js";

const followBtn = document.getElementById("followBtn");
const followers = document.getElementById("followersCount");
const chatBtn = document.getElementById("chatBtn");
const avatar = document.getElementById("profileAvatar");
const avatarInput = document.getElementById("avatarInput");
let following = false;


const {
  data: { user }
} = await supabase.auth.getUser();

if (!user) {
  window.location.href = "login.html";
  throw new Error("User not logged in");
}

const profileId =
  new URLSearchParams(window.location.search).get("id") || user.id;
  console.log("Opening profile:", profileId);

  // Only allow the owner to change their profile picture
if (profileId === user.id) {

  avatar.style.cursor = "pointer";

  avatar.addEventListener("click", () => {
    avatarInput.click();
  });

  avatarInput.addEventListener("change", async () => {

    const file = avatarInput.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
      alert("Please select an image.");
      return;
    }

    if (file.size > 5 * 1024 * 1024) {
      alert("Image must be less than 5MB.");
      return;
    }

    try {

      const fileExt = file.name.split(".").pop();
      const fileName = `${user.id}.${fileExt}`;

      const { error: uploadError } = await supabase
        .storage
        .from("avatars")
        .upload(fileName, file, {
          upsert: true
        });

      if (uploadError) {
        console.error("Avatar upload error:", uploadError);
        alert("Could not upload profile picture.");
        return;
      }

      const { data: publicUrlData } = supabase
        .storage
        .from("avatars")
        .getPublicUrl(fileName);

      const avatarUrl = publicUrlData.publicUrl;

      const { error: updateError } = await supabase
        .from("profiles")
        .update({
          avatar_url: avatarUrl
        })
        .eq("id", user.id);

      if (updateError) {
        console.error("Profile update error:", updateError);
        alert("Picture uploaded, but profile could not be updated.");
        return;
      }

      avatar.src = avatarUrl + "?t=" + Date.now();

      alert("Profile picture updated!");

    } catch (error) {
      console.error(error);
      alert("Something went wrong while uploading.");
    }

  });

}

const backBtn = document.getElementById("profileBack");

const from = new URLSearchParams(window.location.search).get("from");

if (from === "users") {
  backBtn.href = "users.html";
} else if (from === "chat") {
  backBtn.href = `chat.html?user=${profileId}`;
} else {
  backBtn.addEventListener("click", (e) => {
    e.preventDefault();
    history.back();
  });
}
  
const { data: profile } = await supabase
  .from("profiles")
  .select("*")
  .eq("id", profileId)
  .single();

if (profile) {
  document.getElementById("profileName").textContent =
  profile.username ||
  profile.full_name ||
  (profile.role === "producer" ? "Producer" : "Artist");

  const usernameEl = document.getElementById("profileUsername");

if (profile.username) {
  usernameEl.textContent = "@" + profile.username;
  usernameEl.style.display = "block";
} else {
  usernameEl.style.display = "none";
}

  document.getElementById("profileBio").textContent =
    profile.bio || "No bio yet.";

  document.querySelector(".role").textContent =
    `${profile.role === "producer" ? "Producer" : "Artist"}${profile.location ? " • " + profile.location : ""}`;

  if (profile.avatar_url) {
    document.getElementById("profileAvatar").src = profile.avatar_url;
  }

const verifiedBadge = document.getElementById("verifiedBadge");

if (profile.is_verified === true) {
  verifiedBadge.style.display = "inline-flex";
} else {
  verifiedBadge.style.display = "none";
}
  const { count: followersCount } = await supabase
    .from("followers")
    .select("*", { count: "exact", head: true })
    .eq("following_id", profileId);

  const { count: followingCount } = await supabase
    .from("followers")
    .select("*", { count: "exact", head: true })
    .eq("follower_id", profileId);

  document.getElementById("followersCount").textContent = followersCount || 0;
  document.getElementById("followingCount").textContent = followingCount || 0;
}

if (profileId === user.id) {
  document.getElementById("songCard").style.display = "block";
}
  
// Hide Follow + Chat on your own profile
if (profileId === user.id) {
  followBtn.style.display = "none";
  chatBtn.style.display = "none";
}

// Check whether the logged-in user is already following this profile
if (profileId !== user.id) {

  const { data: existingFollow } = await supabase
    .from("followers")
    .select("id")
    .eq("follower_id", user.id)
    .eq("following_id", profileId)
    .maybeSingle();

  following = !!existingFollow;

  if (following) {
    followBtn.classList.add("following");
    followBtn.textContent = "✓ Following";
  }
}
followBtn.addEventListener("click", async () => {

  if (!following) {

    const { error } = await supabase
      .from("followers")
      .insert({
        follower_id: user.id,
        following_id: profileId
      });

    if (error) {
      console.error(error);
      return;
    }

    following = true;
    followBtn.classList.add("following");
    followBtn.textContent = "✓ Following";
    followers.textContent = Number(followers.textContent) + 1;

  } else {

    const { error } = await supabase
      .from("followers")
      .delete()
      .eq("follower_id", user.id)
      .eq("following_id", profileId);

    if (error) {
      console.error(error);
      return;
    }

    following = false;
    followBtn.classList.remove("following");
    followBtn.textContent = "Follow";
    followers.textContent = Number(followers.textContent) - 1;

  }

});

chatBtn.addEventListener("click", () => {
  window.location.href = `chat.html?user=${profileId}`;
});
  // =====================================================
// PROFILE PICTURE UPLOAD
// =====================================================

if (profileId === user.id) {

  avatar.style.cursor = "pointer";

  avatar.addEventListener("click", () => {
    avatarInput.click();
  });

  avatarInput.addEventListener("change", async () => {

    const file = avatarInput.files[0];

    if (!file) return;

    // Check that the file is an image
    if (!file.type.startsWith("image/")) {
      alert("Please select an image.");
      avatarInput.value = "";
      return;
    }

    // Maximum file size: 5MB
    if (file.size > 5 * 1024 * 1024) {
      alert("Image must be less than 5MB.");
      avatarInput.value = "";
      return;
    }

    try {

      const fileExt = file.name.split(".").pop().toLowerCase();
      const fileName = `${user.id}.${fileExt}`;

      // Upload image to Supabase Storage
      const { error: uploadError } = await supabase
        .storage
        .from("avatars")
        .upload(fileName, file, {
          upsert: true
        });

      if (uploadError) {
        console.error("Avatar upload error:", uploadError);
        alert("Could not upload profile picture.");
        return;
      }

      // Get public image URL
      const { data: publicUrlData } = supabase
        .storage
        .from("avatars")
        .getPublicUrl(fileName);

      const avatarUrl = publicUrlData.publicUrl;

      // Save URL to profile
      const { error: updateError } = await supabase
        .from("profiles")
        .update({
          avatar_url: avatarUrl
        })
        .eq("id", user.id);

      if (updateError) {
        console.error("Profile update error:", updateError);
        alert("Picture uploaded, but profile could not be updated.");
        return;
      }

      // Show new picture immediately
      avatar.src = avatarUrl + "?t=" + Date.now();

      alert("Profile picture updated!");

      // Clear file input
      avatarInput.value = "";

    } catch (error) {

      console.error("Avatar upload error:", error);
      alert("Something went wrong while uploading.");

    }

  });

}
  
</script>

</body>
</html>
