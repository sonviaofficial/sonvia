<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONVIA – Producer Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SONVIA</h1>
        <p>Producer Registration</p>
    </header>

    <main>
        <section>
            <h2>Create Producer Account</h2>

            <form>
                <input type="text" placeholder="Producer Name" required>
                <input type="text" placeholder="Studio Name" required>
                <input type="text" placeholder="Studio Address" required>
                <input type="tel" placeholder="Phone Number" required>
                <input type="number" placeholder="Recording Price (₦)" required>
                <input type="number" placeholder="Mixing Price (₦)" required>
                <input type="password" placeholder="Create Password" required>

                <a href="dashboard.html">
    <button type="button">Create Studio Profile</button>
</a>
            </form>
        </section>
    </main>

</body>
</html>
