<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SONVIA – Profile Settings</title>

    <link rel="stylesheet" href="style.css">


    <style>
        body {
            background: #0b0b0b;
            color: #fff;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .settings-header {
            padding: 18px;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .settings-header a {
            color: #fff;
            text-decoration: none;
            font-size: 26px;
        }

        .settings-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .settings-container {
            max-width: 600px;
            margin: auto;
            padding: 25px 18px 100px;
        }

        .profile-picture-box {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-picture-box img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #bbb;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #151515;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #777;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .save-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #16a34a;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .success {
            display: block;
            background: #12351f;
            color: #7dffab;
        }

        .error {
            display: block;
            background: #351212;
            color: #ff8b8b;
        }

        .section-title {
            margin: 30px 0 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #222;
            font-size: 17px;
        }

        .required {
            color: #ff5c5c;
        }

        .profile-note {
            color: #888;
            font-size: 13px;
            line-height: 1.5;
            margin-top: 8px;
        }

        .feedback-box {
    margin-top: 30px;
    padding: 16px;
    border: 1px solid #292929;
    border-radius: 12px;
    background: #111;
}

.feedback-btn {
    width: 100%;
    padding: 14px;
    border: 1px solid #7C3AED;
    border-radius: 10px;
    background: transparent;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.feedback-btn:active {
    transform: scale(0.98);
}

.feedback-note {
    color: #888;
    font-size: 13px;
    line-height: 1.5;
    margin: 9px 0 0;
}
        
    </style>
</head>

<body>

<header class="settings-header">

    <a href="artist-dashboard.html">←</a>

    <h2>Profile Settings</h2>

</header>


<main class="settings-container">

    <div id="message" class="message"></div>


    <!-- PROFILE PICTURE -->

    <div class="profile-picture-box">

        <img
    id="profilePicture"
    src="https://i.pravatar.cc/200"
    alt="Artist Profile Picture"
    style="cursor:pointer;"
>

<input
    type="file"
    id="avatarInput"
    accept="image/*"
    style="display:none;">

        <p class="profile-note">
            Your profile picture can be added to your artist profile.
        </p>

    </div>


    <!-- BASIC INFORMATION -->

    <h3 class="section-title">
        Artist Information
    </h3>


    <div class="form-group">

        <label for="username">
            Artist Name / Username <span class="required">*</span>
        </label>

        <input
            type="text"
            id="username"
            placeholder="e.g. FOSKY.J"
            maxlength="50"
        >

    </div>


    <div class="form-group">

        <label for="bio">
            Bio
        </label>

        <textarea
            id="bio"
            placeholder="Tell people about yourself and your music..."
            maxlength="500"
        ></textarea>

    </div>


    <div class="form-group">

        <label for="genre">
            Genre
        </label>

        <input
            type="text"
            id="genre"
            placeholder="e.g. Afrobeats"
            maxlength="100"
        >

    </div>


    <div class="form-group">

        <label for="location">
            Location
        </label>

        <input
            type="text"
            id="location"
            placeholder="e.g. Lagos, Nigeria"
            maxlength="100"
        >

    </div>


    <!-- CONTACT -->

    <h3 class="section-title">
        Contact
    </h3>


    <div class="form-group">

  <label for="email">
    Email Address <span class="required">*</span>
  </label>

  <input
    type="email"
    id="email"
    placeholder="Your account email"
    readonly
  >

  <p class="profile-note">
    This is your SONVIA account email and cannot be changed here.
  </p>

    </div>

        <label for="phone">
  Phone Number <span class="required">*</span>
        </label>

        <input
  type="tel"
  id="phone"
  placeholder="e.g. 08012345678"
  maxlength="20"
  required
>

    </div>


    <!-- SOCIAL MEDIA -->

    <h3 class="section-title">
        Social Media
    </h3>


    <div class="form-group">

        <label for="instagram">
            Instagram
        </label>

        <input
            type="text"
            id="instagram"
            placeholder="@yourusername"
            maxlength="100"
        >

    </div>


    <div class="form-group">

        <label for="tiktok">
            TikTok
        </label>

        <input
            type="text"
            id="tiktok"
            placeholder="@yourusername"
            maxlength="100"
        >

    </div>


    <div class="form-group">

        <label for="audiomack">
            Audiomack
        </label>

        <input
            type="text"
            id="audiomack"
            placeholder="Audiomack profile link or username"
            maxlength="200"
        >

    </div>


    <!-- FEEDBACK -->

<div class="feedback-box">

    <button
        type="button"
        id="feedbackBtn"
        class="feedback-btn"
    >
        Send Feedback
    </button>

    <p class="feedback-note">
        Something isn't working? Tell us so we can identify and fix it during Early Access.
    </p>

</div>


<button
    type="button"
    id="saveBtn"
    class="save-btn"
>
    Save Profile
</button>

</main>


<script type="module">
import { supabase } from './supabase.js';


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const usernameInput =
        document.getElementById("username");

    const bioInput =
        document.getElementById("bio");

    const genreInput =
        document.getElementById("genre");

    const locationInput =
        document.getElementById("location");

    const phoneInput =
        document.getElementById("phone");
    
    const emailInput =
    document.getElementById("email");

    const instagramInput =
        document.getElementById("instagram");

    const tiktokInput =
        document.getElementById("tiktok");

    const audiomackInput =
        document.getElementById("audiomack");

    const saveBtn =
        document.getElementById("saveBtn");

    const message =
        document.getElementById("message");

    const profilePicture =
    document.getElementById("profilePicture");

const avatarInput =
    document.getElementById("avatarInput");

let avatarUrl = "";

    /* =====================================================
       MESSAGE
       ===================================================== */

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

    }

/* =====================================================
   FEEDBACK
   ===================================================== */

const feedbackBtn = document.getElementById("feedbackBtn");

feedbackBtn.onclick = function () {

    const feedbackMessage =
        "Hello SONVIA, I found something that isn't working.\n\n" +
        "What happened:\n\n" +
        "Page/feature:\n\n" +
        "What I expected:\n\n" +
        "I'm using SONVIA Early Access.";

    const whatsappUrl =
        "https://wa.me/2349026763886?text=" +
        encodeURIComponent(feedbackMessage);

    window.location.href = whatsappUrl;
};
    /* =====================================================
       LOAD ARTIST PROFILE
       ===================================================== */

    async function loadProfile() {

        try {

            const {
                data: {
                    user
                },
                error: userError
            } =
                await supabase.auth.getUser();


            if (userError || !user) {

                window.location.href =
                    "login.html";

                return;

            }
emailInput.value = user.email || "";

            const {
                data: profile,
                error
            } =
                await supabase
                    .from("profiles")
                    .select(`
    username,
    bio,
    genre,
    location,
    phone,
    instagram,
    tiktok,
    audiomack,
    avatar_url
`)
                    .eq("id", user.id)
                    .maybeSingle();


            if (error) {

                console.error(error);

                showMessage(
                    "Unable to load your profile.",
                    "error"
                );

                return;

            }


            if (!profile) {

                showMessage(
                    "Your artist profile is ready to be completed.",
                    "success"
                );

                return;

            }


            usernameInput.value =
                profile.username || "";

            bioInput.value =
                profile.bio || "";

            genreInput.value =
                profile.genre || "";

            locationInput.value =
                profile.location || "";

            phoneInput.value =
                profile.phone || "";

            instagramInput.value =
                profile.instagram || "";

            tiktokInput.value =
                profile.tiktok || "";

            audiomackInput.value =
                profile.audiomack || "";

avatarUrl = profile.avatar_url || "";

if (avatarUrl) {
    profilePicture.src = avatarUrl;
}

        } catch (error) {

            console.error(error);

            showMessage(
                "Something went wrong while loading your profile.",
                "error"
            );

        }

    }


    /* =====================================================
       SAVE ARTIST PROFILE
       ===================================================== */

    async function saveProfile() {

        const username =
            usernameInput.value.trim();

        if (!username) {

            showMessage(
                "Please enter your artist name or username.",
                "error"
            );

            usernameInput.focus();

            return;

        }

const phone = phoneInput.value.trim();

if (!phone) {

  showMessage(
    "Please add your phone number before saving your profile. Your SONVIA account email is already linked to this account.",
    "error"
  );

  phoneInput.focus();

  return;
}
        saveBtn.disabled = true;

        saveBtn.textContent =
            "Saving...";


        try {

            const {
                data: {
                    user
                },
                error: userError
            } =
                await supabase.auth.getUser();


            if (userError || !user) {

                window.location.href =
                    "login.html";

                return;

            }


            const profileData = {

                id: user.id,

                username:
                    username,

                bio:
                    bioInput.value.trim(),

                genre:
                    genreInput.value.trim(),

                location:
                    locationInput.value.trim(),

                phone:
                    phoneInput.value.trim(),

                instagram:
                    instagramInput.value.trim(),

                tiktok:
                    tiktokInput.value.trim(),

                audiomack:
    audiomackInput.value.trim(),

avatar_url:
    avatarUrl

            };


                const { error } =
    await supabase
        .from("profiles")
        .update(profileData)
        .eq("id", user.id);


            if (error) {

                console.error("Save error:", error);
alert(error.message);

                throw error;

            }


            showMessage(
                "✅ Profile saved successfully!",
                "success"
            );


            saveBtn.textContent =
                "Saved ✓";


            setTimeout(() => {

                saveBtn.textContent =
                    "Save Profile";

            }, 2000);

        }

        catch (error) {

            console.error(error);

            showMessage(
                "❌ Could not save your profile. Please try again.",
                "error"
            );

        }

        finally {

            saveBtn.disabled = false;

        }

    }
profilePicture.addEventListener("click", () => {
    avatarInput.click();
});

avatarInput.addEventListener("change", async () => {

    const file = avatarInput.files[0];

    if (!file) return;

    const {
        data: { user }
    } = await supabase.auth.getUser();

    const ext =
        file.name.split(".").pop();

    const filePath =
        `${user.id}.${ext}`;

    const { error: uploadError } =
        await supabase.storage
            .from("avatars")
            .upload(filePath, file, {
                upsert: true
            });

    if (uploadError) {

        showMessage(
            uploadError.message,
            "error"
        );

        return;
    }

    const {
        data: { publicUrl }
    } =
        supabase.storage
            .from("avatars")
            .getPublicUrl(filePath);

    avatarUrl = publicUrl;

    profilePicture.src = avatarUrl;
});

    /* =====================================================
       SAVE BUTTON
       ===================================================== */

    saveBtn.addEventListener(
        "click",
        saveProfile
    );


    /* =====================================================
       START
       ===================================================== */

    loadProfile();

</script>

</body>
  </html>
