<script type="module">

import { supabase } from './supabase.js';

  // SONVIA NOTIFICATION BELL & BADGE

function updateNotificationBadge(count) {
  const badge = document.getElementById("notificationCount");

  if (!badge) return;

  const total = Math.max(0, Number(count) || 0);

  if (total === 0) {
    badge.style.display = "none";
    badge.textContent = "";
    return;
  }

  badge.style.display = "flex";
  badge.textContent = total > 99 ? "99+" : String(total);
}

// TEMPORARY TEST: show 5 notifications
updateNotificationBadge(5);

// FOLLOWERS
function formatFollowers(count){
if(count===1) return "1 Follower";
if(count<1000) return `${count} Followers`;
if(count<1000000){
const value=(count/1000).toFixed(count>=10000?0:1);
return `${value.replace(".0","")}K Followers`;
}
const value=(count/1000000).toFixed(count>=10000000?0:1);
return `${value.replace(".0","")}M Followers`;
}

document.getElementById("followersCount").textContent=formatFollowers(0);

// NOTIFICATIONS
function updateNotificationBadge(count){
const badge=document.getElementById("notificationCount");
if(count<=0){
badge.style.display="none";
return;
}
badge.style.display="flex";
badge.textContent=count>99?"99+":count;
}
updateNotificationBadge(0);

document.getElementById("notificationBell")
.addEventListener("click",()=>{
window.location.href="notifications.html";
});

// BOOK NOW
document.getElementById("bookNowBtn")
.addEventListener("click",()=>{
window.location.href="book-session.html";
});

// SONG SHOWCASE

async function loadSongShowcase() {
  const showcase = document.getElementById("songShowcase");

  if (!showcase) {
    console.error("SONVIA: songShowcase element is missing.");
    return;
  }

  showcase.textContent = "Loading songs...";

  try {
    const {
      data: { user },
      error: authError
    } = await supabase.auth.getUser();

    if (authError) throw authError;

    if (!user) {
      showcase.textContent = "Please log in to view your songs.";
      return;
    }

    const { data: songs, error: songsError } = await supabase
      .from("songs")
      .select("*")
      .eq("artist_id", user.id)
      .order("created_at", { ascending: false })
      .limit(3);

    if (songsError) throw songsError;

    showcase.replaceChildren();

    if (!songs || songs.length === 0) {
      const message = document.createElement("p");
      message.textContent =
        "No songs found yet. Upload your songs so producers can hear your sound.";
      showcase.appendChild(message);

      const link = document.createElement("a");
      link.href = "my-songs.html";
      link.textContent = "Upload / Manage Songs";
      link.style.color = "#9F67FF";
      showcase.appendChild(link);

      return;
    }

    songs.forEach((song) => {
      const card = document.createElement("div");
      card.style.cssText =
        "padding:12px 0;border-bottom:1px solid #333;";

      const title = document.createElement("h4");
      title.textContent = song.title || "Untitled Song";
      title.style.margin = "0 0 10px";
      card.appendChild(title);

      if (song.audio_url) {
        const audio = document.createElement("audio");
        audio.controls = true;
        audio.preload = "none";
        audio.style.width = "100%";
        audio.src = song.audio_url;
        card.appendChild(audio);
      } else {
        const missing = document.createElement("p");
        missing.textContent = "Audio file URL is missing for this song.";
        card.appendChild(missing);
      }

      showcase.appendChild(card);
    });

    const link = document.createElement("a");
    link.href = "my-songs.html";
    link.textContent = "View All Songs";
    link.style.cssText =
      "display:inline-block;margin-top:14px;color:#9F67FF;";
    showcase.appendChild(link);

  } catch (error) {
    console.error("SONVIA Song Showcase error:", error);

    showcase.replaceChildren();

    const message = document.createElement("p");
    message.textContent =
      "Songs couldn't load: " + (error.message || "Unknown error");
    message.style.color = "#ff8585";
    showcase.appendChild(message);

    const retry = document.createElement("button");
    retry.type = "button";
    retry.textContent = "Try Again";
    retry.style.cssText =
      "margin-top:10px;padding:10px 16px;background:#7C3AED;color:white;border:0;border-radius:8px;cursor:pointer;";
    retry.addEventListener("click", loadSongShowcase);
    showcase.appendChild(retry);
  }
}
  

// LOAD ARTIST
async function loadArtist() {
try {
const { data: { user } } = await supabase.auth.getUser();

if (!user) {
  window.location.href = "login.html";
  return;
}

const { data: profile, error } = await supabase
  .from("profiles")
  .select("*")
  .eq("id", user.id)
  .single();

if (error) throw error;
if (!profile) return;

const artistName =
  profile.username ||
  profile.artist_name ||
  profile.full_name ||
  "Artist";

document.getElementById("artistName").textContent = artistName;

document.getElementById("artistTag").textContent = "@" + (
  profile.username ||
  artistName.replace(/\s+/g, "").toLowerCase()
);

// LOAD ARTIST PROFILE PICTURE
const avatar = document.getElementById("avatar");

const avatarUrl = profile.avatar_url || profile.profile_picture;

if (avatarUrl && avatarUrl.trim() !== "") {
  const separator = avatarUrl.includes("?") ? "&" : "?";

  avatar.src = avatarUrl + separator + "t=" + Date.now();
} else {
  console.warn("No artist profile picture URL found in Supabase.");
}

const verifiedBadge = document.getElementById("artistVerifiedBadge");
const verifiedText = document.getElementById("artistVerifiedText");

if (profile.is_verified === true) {
  verifiedText.textContent = "Verified";
  verifiedBadge.classList.remove("get-verified");
  verifiedBadge.onclick = null;
  verifiedBadge.style.cursor = "default";
} else {
  verifiedText.textContent = "Get Verified";
  verifiedBadge.classList.add("get-verified");
  verifiedBadge.style.cursor = "pointer";
  verifiedBadge.onclick = () => {
    window.location.href = "get-verified.html";
  };
}

} catch (err) {
console.error("Error loading artist profile:", err);
}
}

// AVATAR UPLOAD — SONVIA
const avatar = document.getElementById("avatar");
const avatarInput = document.getElementById("avatarInput");

if (avatar && avatarInput) {

  avatar.addEventListener("click", () => {
    avatarInput.click();
  });

  avatarInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    try {
      const {
        data: { user },
        error: userError
      } = await supabase.auth.getUser();

      if (userError) throw userError;
      if (!user) throw new Error("Please log in again.");

      if (!file.type.startsWith("image/")) {
        throw new Error("Please choose an image file.");
      }

      if (file.size > 5 * 1024 * 1024) {
        throw new Error("Please choose an image smaller than 5 MB.");
      }

      const extension = file.name.split(".").pop().toLowerCase();
      const path = `${user.id}/avatar.${extension}`;

      const { error: uploadError } = await supabase.storage
        .from("avatars")
        .upload(path, file, { upsert: true });

      if (uploadError) throw uploadError;

      const { data } = supabase.storage
        .from("avatars")
        .getPublicUrl(path);

      const { error: updateError } = await supabase
        .from("profiles")
        .update({
          avatar_url: data.publicUrl,
          profile_picture: data.publicUrl
        })
        .eq("id", user.id);

      if (updateError) throw updateError;

      avatar.src = data.publicUrl + "?t=" + Date.now();

      alert("Profile picture updated successfully!");

    } catch (error) {
      console.error("SONVIA avatar upload error:", error);
      alert("Could not update profile picture: " + error.message);
    }

    // Allow selecting the same image again.
    avatarInput.value = "";
  });
  
} else {
  console.error("SONVIA: avatar or avatarInput element is missing.");
}

// LOGOUT
document.getElementById("logoutBtn")
.addEventListener("click",async()=>{

await supabase.auth.signOut();

localStorage.clear();

window.location.href="login.html";

});

loadArtist();
await loadSongShowcase();

</script>
