<title>SONVIA • Artist Dashboard</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b0b0f;
color:#fff;
}

.header{
padding:24px 20px;
background:linear-gradient(180deg,#7C3AED,#1b132e);
}

.profile{
display:flex;
gap:15px;
align-items:center;
}

.avatar{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
border:3px solid #9F67FF;
background:#222;
cursor:pointer;
}

.username{
color:#b8b8b8;
font-size:14px;
}

.verified{
display:inline-flex;
align-items:center;
gap:5px;
padding:5px 10px;
border-radius:999px;
background:rgba(124,58,237,.15);
border:1px solid #7C3AED;
font-size:12px;
}

.verify-dot{
width:16px;
height:16px;
border-radius:50%;
background:#7C3AED;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
}

.section{
padding:20px;
}

.card{
background:#15151d;
border-radius:18px;
padding:18px;
margin-bottom:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.action{
display:flex;
justify-content:center;
align-items:center;
text-decoration:none;
color:white;
background:#1b1b25;
border-radius:18px;
padding:18px;
text-align:center;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#7C3AED;
color:white;
font-size:15px;
cursor:pointer;
}

.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
background:#111;
display:flex;
border-top:1px solid #2a2a2a;
padding:10px 0;
}

.bottom>div{
flex:1;
display:flex;
justify-content:center;
}

.nav-item{
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
color:#bbb;
text-decoration:none;
font-size:12px;
}

.song{
background:#181824;
padding:12px;
border-radius:12px;
margin-bottom:12px;
}
</style>

</head>

<script type="module">

import { supabase } from './supabase.js';

// FOLLOWERS
function formatFollowers(count){
if(count===1) return "1 Follower";
if(count<1000) return `${count} Followers`;
if(count<1000000){
const value=(count/1000).toFixed(count>=10000?0:1);
return `${value.replace(".0","")}K Followers`;
}
const value=(count/1000000).toFixed(count>=10000000?0:1);
return `${value.replace(".0","")}M Followers`;
}

document.getElementById("followersCount").textContent=formatFollowers(0);

// NOTIFICATIONS
function updateNotificationBadge(count){
const badge=document.getElementById("notificationCount");
if(count<=0){
badge.style.display="none";
return;
}
badge.style.display="flex";
badge.textContent=count>99?"99+":count;
}
updateNotificationBadge(0);

document.getElementById("notificationBell")
.addEventListener("click",()=>{
window.location.href="notifications.html";
});

// BOOK NOW
document.getElementById("bookNowBtn")
.addEventListener("click",()=>{
window.location.href="book-session.html";
});

// SONG SHOWCASE
async function loadSongShowcase(){

const {data:{user}}=await supabase.auth.getUser();

const {data:songs}=await supabase
.from("songs")
.select("*")
.eq("artist_id",user.id)
.order("created_at",{ascending:false})
.limit(3);

const showcase=document.getElementById("songShowcase");

if(!songs||songs.length===0){
showcase.innerHTML=`
<h3>No songs yet</h3>
<p>Upload up to 3 songs for producers to hear your sound.</p>
<a href="my-songs.html"><button>My Songs</button></a>`;
return;
}

showcase.innerHTML=songs.map(song=>`
<div class="song">
<h4>${song.title}</h4>
<audio controls>
<source src="${song.audio_url}">
</audio>
</div>`).join("")+
`<a href="my-songs.html"><button>View All Songs</button></a>`;
}

// LOAD ARTIST
async function loadArtist(){

try{

const {data:{user}}=await supabase.auth.getUser();

if(!user){
window.location.href="login.html";
return;
}

const {data:profile}=await supabase
.from("profiles")
.select("*")
.eq("id",user.id)
.single();

if(profile){

const artistName=
profile.username||
profile.artist_name||
profile.full_name||
"Artist";

document.getElementById("artistName").textContent=artistName;

document.getElementById("artistTag").textContent="@"+(
profile.username||
artistName.replace(/\s+/g,"").toLowerCase()
);

if(profile.avatar_url){
document.getElementById("avatar").src=profile.avatar_url;
}

}

}catch(err){
console.error(err);
}

}

// AVATAR
document.getElementById("avatar")
.addEventListener("click",()=>{
document.getElementById("avatarInput").click();
});

document.getElementById("avatarInput")
.addEventListener("change",async(e)=>{

const file=e.target.files[0];
if(!file) return;

const {data:{user}}=await supabase.auth.getUser();

const path=`${user.id}/avatar.${file.name.split(".").pop()}`;

const {error}=await supabase.storage
.from("avatars")
.upload(path,file,{upsert:true});

if(error){
alert(error.message);
return;
}

const {data}=supabase.storage
.from("avatars")
.getPublicUrl(path);

await supabase
.from("profiles")
.update({avatar_url:data.publicUrl})
.eq("id",user.id);

document.getElementById("avatar").src=data.publicUrl+"?t="+Date.now();

});

// LOCATION
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(()=>{
document.getElementById("locationText").textContent="📍 Around your location";
},()=>{
document.getElementById("locationText").textContent="Location unavailable";
});
}

// LOGOUT
document.getElementById("logoutBtn")
.addEventListener("click",async()=>{

await supabase.auth.signOut();

localStorage.clear();

window.location.href="login.html";

});

loadArtist();
await loadSongShowcase();

</script>
