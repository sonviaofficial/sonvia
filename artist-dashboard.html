<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONVIA • Artist Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <box gap=1 align=center padding=4>
    <badge label="🟣 Early Access Member" color=discovery size=md />
    <title size=xl>SONVIA</title>
    <text>Artist Dashboard</text>
  </box>
</header>

<main class="container">

  <box background=surface radius=2xl padding=3 gap=3>
    <row align=center gap=3>
      <box radius="100%" clip background=surface-secondary border=1>
        <AsyncImage query="default user avatar profile circle" aspectRatio="1:1" maxWidth=72 maxHeight=72/>
      </box>

      <box gap=1 flex=1>
        <title id="artistName">Loading...</title>
        <text id="artistTag">@artist</text>
        <badge label="Artist" color=discovery />
      </box>
    </row>

    <button block variant=outline>📸 Change Profile Picture</button>
  </box>

  <grid columns=2>
    <grid-item>
      <box background=surface radius=xl padding=3 align=center gap=2>
        <icon name=search color=discovery />
        <text textAlign=center>Find Producers</text>
      </box>
    </grid-item>
    <grid-item>
      <box background=surface radius=xl padding=3 align=center gap=2>
        <icon name=calendar color=discovery />
        <text textAlign=center>Book Session</text>
      </box>
    </grid-item>
    <grid-item>
      <box background=surface radius=xl padding=3 align=center gap=2>
        <icon name=music color=discovery />
        <text textAlign=center>My Projects</text>
      </box>
    </grid-item>
    <grid-item>
      <box background=surface radius=xl padding=3 align=center gap=2>
        <icon name=wallet color=discovery />
        <text textAlign=center>Wallet</text>
      </box>
    </grid-item>
  </grid>

  <box background=surface radius=xl padding=3 gap=3>
    <row justify=between align=center>
      <title size=md>Recommended Producers</title>
      <text size=sm>See all</text>
    </row>

    <box background=surface-secondary radius=lg padding=3 gap=2 border=1>
      <row justify=between align=center>
        <box gap=0>
          <text strong>FOSKY Studio</text>
          <row gap=1 align=center wrap=wrap>
            <icon name=map-pin color=secondary />
            <text size=sm>Ikorodu, Lagos</text>
          </row>
        </box>
        <badge label="Verified" color=discovery />
      </row>

      <row justify=between align=center>
        <box gap=0>
          <text size=sm>Vocal Recording</text>
          <title size=sm>₦50,000</title>
        </box>
        <button size=sm>Book Now</button>
      </row>
    </box>
  </box>

  <box background=surface radius=xl padding=3 gap=3>
    <title size=md>Recent Bookings</title>

    <box background=surface-secondary radius=lg padding=3 gap=1 border=1 align=center>
      <icon name=calendar color=secondary />
      <text>No bookings yet.</text>
      <text size=sm>Your upcoming sessions will appear here.</text>
    </box>
  </box>

  <button block color=danger variant=outline id="logoutBtn">Log Out</button>

</main>

<box background="#111111" border={{top:{size:1,color:"#222"}}} padding=3>
  <row justify=between align=center>
    <box align=center gap=1>
      <icon name=home color=discovery />
      <text size=xs>Home</text>
    </box>
    <box align=center gap=1>
      <icon name=search color=secondary />
      <text size=xs>Explore</text>
    </box>
    <box align=center gap=1>
      <icon name=calendar color=secondary />
      <text size=xs>Bookings</text>
    </box>
    <box align=center gap=1>
      <icon name=wallet color=secondary />
      <text size=xs>Wallet</text>
    </box>
    <box align=center gap=1>
      <icon name=circle-user color=secondary />
      <text size=xs>Profile</text>
    </box>
  </row>
</box>

<script type="module">
import { supabase } from './supabase.js';

const { data: { user } } = await supabase.auth.getUser();

if(!user){
  window.location.href='login.html';
}

const { data: profile } = await supabase
.from('profiles')
.select('*')
.eq('id', user.id)
.single();

if(profile){
  document.getElementById('artistName').textContent =
      profile.artist_name || profile.full_name || 'Artist';

  document.getElementById('artistTag').textContent =
      '@' + (profile.artist_name || 'artist')
      .replace(/\s+/g,'')
      .toLowerCase();
}

document.getElementById('logoutBtn').onclick = async ()=>{
  await supabase.auth.signOut();
  localStorage.clear();
  window.location.href='login.html';
}
</script>

</body>
</html>
