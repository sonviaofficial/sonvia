<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONVIA – Producer Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>SONVIA</h1>
    <p>Create Producer Account</p>
</header>

<main>
    <section>
        <h2>Producer Registration</h2>

        <form id="producerForm">

            <input type="text" id="producerName" placeholder="Producer Name" required>

            <input type="text" id="studioName" placeholder="Studio Name" required>

            <input type="text" id="studioLocation" placeholder="Studio Location" required>

            <input type="email" id="email" placeholder="Email Address" required>

            <input type="password" id="password" placeholder="Password" required>

            <input type="text" id="tiktokUsername" placeholder="TikTok Username" required>

            <input type="url" id="tiktokLink" placeholder="TikTok Profile Link" required>

            <input type="number" id="recordingPrice" placeholder="Recording Price" required>

            <input type="number" id="mixingPrice" placeholder="Mixing Price" required>

            <input type="number" id="masteringPrice" placeholder="Mastering Price" required>

            <button type="button" id="verifyTikTokBtn">
                Verify TikTok
            </button>

            <p id="verifyStatus" style="color:#9ca3af;font-size:14px;"></p>

            <button type="submit">
                Create Producer Account
            </button>

        </form>
    </section>
</main>

<script type="module">

import { supabase } from './supabase.js';

let tiktokVerified = false;

document.getElementById('verifyTikTokBtn').addEventListener('click', function () {

    const username = document.getElementById('tiktokUsername').value.trim();
    const link = document.getElementById('tiktokLink').value.trim();

    if (!username || !link) {
        alert('❌ Enter your TikTok username and link first.');
        return;
    }

    tiktokVerified = true;

    document.getElementById('verifyStatus').textContent = '✅ TikTok verified successfully';
    document.getElementById('verifyStatus').style.color = '#16a34a';
});

document.getElementById('producerForm').addEventListener('submit', async function (e) {

    e.preventDefault();

    if (!tiktokVerified) {
        alert('❌ Please verify your TikTok first.');
        return;
    }

    const producerName = document.getElementById('producerName').value.trim();
    const studioName = document.getElementById('studioName').value.trim();
    const studioLocation = document.getElementById('studioLocation').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const tiktokUsername = document.getElementById('tiktokUsername').value.trim();
    const tiktokLink = document.getElementById('tiktokLink').value.trim();
    const recordingPrice = Number(document.getElementById('recordingPrice').value);
    const mixingPrice = Number(document.getElementById('mixingPrice').value);
    const masteringPrice = Number(document.getElementById('masteringPrice').value);

    const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
            emailRedirectTo: 'https://sonviaofficial.github.io/sonvia/'
        }
    });

    if (error) {
        alert('❌ ' + error.message);
        return;
    }

    const user = data.user;

    if (user) {

        await supabase.from('profiles').insert({
            id: user.id,
            role: 'producer',
            producer_name: producerName,
            studio_name: studioName,
            studio_location: studioLocation,
            email: email,
            tiktok_username: tiktokUsername,
            tiktok_link: tiktokLink,
            tiktok_verified: true
        });

        await supabase.from('producer_services').insert({
            producer_id: user.id,
            recording_price: recordingPrice,
            mixing_price: mixingPrice,
            mastering_price: masteringPrice
        });
    }

    alert('📧 Verification email sent! Please verify your email before logging in.');

    window.location.href = 'login.html';
});

</script>
</body>
</html>
