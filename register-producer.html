<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONVIA – Producer Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SONVIA</h1>
        <p>Create Producer Account</p>
    </header>

    <main>
        <section>
            <h2>Producer Registration</h2>

            <form id="producerForm">

                <input type="text" id="producerName" placeholder="Producer Name" required>

                <input type="text" id="studioLocation" placeholder="Studio Location" required>

                <input type="email" id="email" placeholder="Email Address" required>

                <input type="password" id="password" placeholder="Password" required>

                <input type="text" id="tiktokUsername" placeholder="TikTok Username" required>

                <input type="url" id="tiktokLink" placeholder="TikTok Profile Link">

                <input type="number" id="recordingPrice" placeholder="Recording Price (₦)" required>

                <input type="number" id="mixingPrice" placeholder="Mixing Price (₦)" required>

                <input type="number" id="masteringPrice" placeholder="Mastering Price (₦)" required>

                <label>Profile Picture</label>
                <input type="file" id="profilePicture" accept="image/*">

                <button type="button" id="verifyBtn">
                    🔐 Verify TikTok
                </button>

                <p id="tiktokStatus">❌ TikTok not verified</p>

                <button type="submit">Create Producer Account</button>

            </form>
        </section>
    </main>

    <script>
    let tiktokVerified = false;

    // Verify TikTok button
    document.getElementById("verifyBtn").addEventListener("click", function() {

        const username = document.getElementById("tiktokUsername").value.trim();

        if (username === "") {
            alert("⚠️ Please enter your TikTok username first");
            return;
        }

        tiktokVerified = true;

        document.getElementById("tiktokStatus").innerHTML =
            "✅ TikTok Verified";

        alert("✅ TikTok verified successfully!");
    });

    // Create account
    document.getElementById("producerForm").addEventListener("submit", function(e) {

        e.preventDefault();

        // Stop if TikTok is not verified
        if (tiktokVerified === false) {
            alert("⚠️ You must verify your TikTok account before creating an account.");
            return;
        }

        const producerData = {
            producerName: document.getElementById("producerName").value,
            studioLocation: document.getElementById("studioLocation").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            tiktokUsername: document.getElementById("tiktokUsername").value,
            tiktokLink: document.getElementById("tiktokLink").value,
            recordingPrice: document.getElementById("recordingPrice").value,
            mixingPrice: document.getElementById("mixingPrice").value,
            masteringPrice: document.getElementById("masteringPrice").value
        };

        localStorage.setItem("sonviaProducer", JSON.stringify(producerData));

        localStorage.setItem("sonviaLoggedIn", "true");
        localStorage.setItem("sonviaUserRole", "producer");

        alert("🎉 Producer account created successfully!");

        window.location.href = "profile.html";
    });
    </script>

</body>
</html>
