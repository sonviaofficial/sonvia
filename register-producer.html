<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONVIA – Producer Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SONVIA</h1>
        <p>Join as a Producer</p>
    </header>
<nav class="navbar">
    <a href="producer.html">🏠 Producers</a>
    <a href="register-producer.html">➕ Join Producer</a>
</nav>
    <main>
        <section>
            <h2>Producer Registration</h2>

            <form>

                <input type="text" placeholder="Studio Name" required>

                <input type="text" placeholder="Producer Name" required>

                <input type="text" placeholder="Studio Location" required>

                <input type="number" placeholder="Vocal Recording Price (₦)" required>

                <input type="number" placeholder="Mixing Price (₦)" required>

                <input type="number" placeholder="Mastering Price (₦)" required>

                <div class="file-upload">
    <label for="studioImage">📷 Upload Studio Image (optional)</label>
    <input type="file" id="studioImage" accept="image/*">
</div>

                <button type="submit">Submit Application</button>

            </form>
        </section>
    </main>

</body>
</html>
