<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONVIA – Create Post</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="top-header">
            <div class="bell">🔔</div>

            <div class="home-tabs">
                <span class="active-tab">Create Post</span>
            </div>

            <img src="https://i.pravatar.cc/80" alt="Profile" class="profile-pic">
        </div>

        <div class="logo-area">
            <h1>SONVIA</h1>
            <p>Share your studio work</p>
        </div>
    </header>

    <main class="post-container">

        <section class="post-card">

            <h2>🎬 Upload Studio Preview</h2>
            <p class="post-note">
                Only producers can upload studio videos (45–60 seconds).
            </p>

            <form id="postForm">

                <input type="text" placeholder="Studio Name" required>

                <textarea
                    placeholder="Write a short caption about your studio session..."
                    rows="4"
                    required></textarea>

                <div class="upload-box">
                    <label for="studioVideo">🎥 Choose Studio Video</label>
                    <input
                        type="file"
                        id="studioVideo"
                        accept="video/mp4,video/webm,video/ogg"
                        required>
                </div>

                <div class="upload-box">
                    <label for="studioImage">🖼️ Choose Studio Cover Image</label>
                    <input
                        type="file"
                        id="studioImage"
                        accept="image/*">
                </div>

                <button type="submit">🚀 Publish Post</button>

            </form>

        </section>

        <section class="post-card preview-card">

            <h3>📱 Post Preview</h3>

            <div class="preview-image" id="imagePreview">
    <p>Studio cover will appear here</p>
</div>

<video controls class="studio-video" id="videoPreview" style="display:none;"></video>

            <div class="preview-content">
                <h4>FOSKY Studio</h4>
                <p>🎙️ Late night recording session at SONVIA Studio.</p>
            </div>

        </section>

    </main>

    <nav class="bottom-nav">
        <a href="dashboard.html">
            <span>🏠</span>
            <small>Home</small>
        </a>

        <a href="producer.html">
            <span>🔍</span>
            <small>Explore</small>
        </a>

        <a href="post.html" class="post-btn active">+</a>

        <a href="meet.html">
            <span>👥</span>
            <small>Meet</small>
        </a>

        <a href="earnings.html">
            <span>💰</span>
            <small>Earnings</small>
        </a>
    </nav>
<script>
const imageInput = document.getElementById("studioImage");
const videoInput = document.getElementById("studioVideo");

const imagePreview = document.getElementById("imagePreview");
const videoPreview = document.getElementById("videoPreview");

// Image preview
imageInput.addEventListener("change", function () {
    const file = this.files[0];

    if (file) {
        const reader = new FileReader();

        reader.onload = function (e) {
            imagePreview.innerHTML =
                `<img src="${e.target.result}" class="preview-photo">`;
        };

        reader.readAsDataURL(file);
    }
});

// Video preview
videoInput.addEventListener("change", function () {
    const file = this.files[0];

    if (file) {
        const videoURL = URL.createObjectURL(file);

        videoPreview.src = videoURL;
        videoPreview.style.display = "block";
    }
});
// Publish post
document.getElementById("postForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const studioName = this.querySelector("input[type='text']").value;
    const caption = this.querySelector("textarea").value;

    const post = {
        studio: studioName,
        caption: caption,
        image: imagePreview.innerHTML,
        video: videoPreview.src || "",
        time: new Date().toLocaleString()
    };

    const posts = JSON.parse(localStorage.getItem("sonviaPosts")) || [];

    posts.unshift(post);

    localStorage.setItem("sonviaPosts", JSON.stringify(posts));

    alert("🎉 Post published successfully!");

    window.location.href = "dashboard.html";
});

</script>
</body>
</html>
