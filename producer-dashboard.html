body{

.header{

.profile{

.avatar{

.username{

.verified{

align-items:center;

height:15px;

.card{
background:#15151d;
padding:18px;
border-radius:18px;
margin-bottom:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.action{
display:flex;
align-items:center;
justify-content:center;
background:#1b1b25;
padding:18px;
border-radius:18px;
text-decoration:none;
color:white;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#7C3AED;
color:white;
font-size:15px;
cursor:pointer;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
display:flex;
justify-content:space-around;
padding:12px 8px;
border-top:1px solid #222;
}

.bottom>div{
flex:1;

justify-content:center;
}

.nav-item{
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
text-decoration:none;
color:#bbb;
font-size:11px;
}
</style>

<script>
function formatFollowers(count){

if(count===1)return"1 Follower";

if(count<1000)return`${count} Followers`;

if(count<1000000){

const value=(count/1000).toFixed(count>=10000?0:1);

return`${value.replace(".0","")}K Followers`;

}

const value=(count/1000000).toFixed(count>=10000000?0:1);

return`${value.replace(".0","")}M Followers`;

}

document.getElementById("followersCount").textContent=
formatFollowers(0);

function updateNotificationBadge(count){

const badge=document.getElementById("notificationCount");

if(count<=0){

badge.style.display="none";
return;

}

badge.style.display="flex";
badge.textContent=count>99?"99+":count;

}

updateNotificationBadge(0);

document.getElementById("notificationBell")
.addEventListener("click",()=>{

window.location.href="notifications.html";

});

document.getElementById("studioAvatar")
.addEventListener("click",()=>{

document.getElementById("studioAvatarInput").click();

});
