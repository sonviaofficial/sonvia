<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONVIA • Bookings</title>

<link rel="stylesheet" href="style.css">

<style>
body{
background:#0b0b0f;
color:white;
font-family:Arial,sans-serif;
margin:0;
}

.header{
display:flex;
align-items:center;
gap:15px;
padding:20px;
background:linear-gradient(180deg,#7C3AED,#1b132e);
}

.back{
color:white;
text-decoration:none;
font-size:26px;
}

.container{
padding:20px;
padding-bottom:100px;
}

.card{
background:#15151d;
padding:18px;
border-radius:18px;
margin-bottom:16px;
}

.card h3{
margin-top:0;
}

.status{
display:inline-block;
margin-top:12px;
padding:6px 12px;
border-radius:999px;
background:rgba(124,58,237,.18);
color:#B794F6;
font-size:13px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#7C3AED;
color:white;
margin-top:18px;
font-size:15px;
}

.empty{
color:#aaa;
text-align:center;
padding:30px 10px;
}
</style>
</head>

<body>

<div class="header">
<a href="artist-dashboard.html" class="back">←</a>
<h2>Bookings</h2>
</div>

<div class="container">

<div id="bookingsList"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://kuhynelblomedbyjsqhas.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1aHluZWxib21lZGJ5anNxaGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NTEyMzYsImV4cCI6MjEwMjIyNzIzNn0.V0AvGoj1_qG2IspiSAyoOnqaSTNlQO8qoS_vaV7ZNl8";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

const bookingsList =
document.getElementById("bookingsList");


async function loadBookings(){

    try{

        const {
            data:{
                user
            },
            error:userError
        } =
        await supabase.auth.getUser();


        if(userError || !user){

            window.location.href =
            "login.html";

            return;
        }


        const {
            data:profile,
            error:profileError
        } =
        await supabase
        .from("profiles")
        .select("role")
        .eq("id",user.id)
        .single();


        if(profileError || !profile){

            bookingsList.innerHTML = `
                <div class="card">
                    <div class="empty">
                        Unable to load your profile.
                    </div>
                </div>
            `;

            return;
        }


        let query =
        supabase
        .from("bookings")
        .select("*");


        if(profile.role === "producer"){

            query =
            query.eq(
                "producer_id",
                user.id
            );

        }else{

            query =
            query.eq(
                "artist_id",
                user.id
            );

        }


        const {
            data:bookings,
            error
        } =
        await query
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error){

            console.error(
                "Booking error:",
                error
            );

            bookingsList.innerHTML = `
                <div class="card">
                    <div class="empty">
                        Unable to load bookings.
                    </div>
                </div>
            `;

            return;
        }


        bookingsList.innerHTML = "";


        if(!bookings || bookings.length === 0){

            bookingsList.innerHTML = `
                <div class="card">

                    <h3>No bookings yet</h3>

                    <p>
                        Your studio bookings will appear here.
                    </p>

                    <div class="status">
                        No bookings
                    </div>

                    <button
                        onclick="location.href='explore.html'">
                        Find Producers
                    </button>

                </div>
            `;

            return;
        }


        bookings.forEach(
        booking => {

            const isProducer =
            profile.role === "producer";

            const isPending =
            booking.status === "pending";


            const card =
            document.createElement("div");

            card.className = "card";


            card.innerHTML = `
                <h3>
                    ${booking.service_name || "Studio Session"}
                </h3>

                <p>
                    <strong>
                        ₦${Number(
                            booking.amount || 0
                        ).toLocaleString()}
                    </strong>
                </p>

                <p>
                    ${
                        booking.booking_date
                        ?
                        new Date(
                            booking.booking_date
                        ).toLocaleDateString()
                        :
                        "Date not set"
                    }
                </p>

                ${
                    booking.session_time
                    ?
                    `<p>${booking.session_time}</p>`
                    :
                    ""
                }

                ${
                    booking.booking_code
                    ?
                    `<p>
                        <strong>Reference:</strong>
                        ${booking.booking_code}
                    </p>`
                    :
                    ""
                }

                <div class="status">
                    ${booking.status}
                </div>

                ${
                    isProducer && isPending
                    ?
                    `
                    <div style="
                        display:flex;
                        gap:10px;
                        margin-top:16px;
                    ">

                        <button
                            class="accept-btn"
                            data-id="${booking.id}"
                            style="
                                flex:1;
                                margin-top:0;
                            ">
                            Accept
                        </button>

                        <button
                            class="reject-btn"
                            data-id="${booking.id}"
                            style="
                                flex:1;
                                margin-top:0;
                                background:#991B1B;
                            ">
                            Reject
                        </button>

                    </div>
                    `
                    :
                    ""
                }
            `;


            bookingsList.appendChild(card);


            const acceptBtn =
            card.querySelector(
                ".accept-btn"
            );

            const rejectBtn =
            card.querySelector(
                ".reject-btn"
            );


            if(acceptBtn){

                acceptBtn.onclick =
                async()=>{

                    acceptBtn.disabled =
                    true;

                    acceptBtn.textContent =
                    "Accepting...";


                    const {
                        error
                    } =
                    await supabase
                    .from("bookings")
                    .update({
                        status:"confirmed"
                    })
                    .eq(
                        "id",
                        booking.id
                    );


                    if(error){

                        console.error(error);

                        alert(
                            "Unable to accept this booking."
                        );

                        acceptBtn.disabled =
                        false;

                        acceptBtn.textContent =
                        "Accept";

                        return;
                    }


                    location.reload();

                };

            }


            if(rejectBtn){

                rejectBtn.onclick =
                async()=>{

                    const ok =
                    confirm(
                        "Reject this booking? The artist will receive a refund."
                    );


                    if(!ok)
                    return;


                    rejectBtn.disabled =
                    true;

                    rejectBtn.textContent =
                    "Rejecting...";


                    const {
                        error
                    } =
                    await supabase
                    .from("bookings")
                    .update({
                        status:"rejected"
                    })
                    .eq(
                        "id",
                        booking.id
                    );


                    if(error){

                        console.error(error);

                        alert(
                            "Unable to reject this booking."
                        );

                        rejectBtn.disabled =
                        false;

                        rejectBtn.textContent =
                        "Reject";

                        return;
                    }


                    location.reload();

                };

            }

        });


    }catch(error){

        console.error(error);

        bookingsList.innerHTML = `
            <div class="card">
                <div class="empty">
                    Something went wrong while loading bookings.
                </div>
            </div>
        `;

    }

}


loadBookings();

</script>

</body>
</html>
