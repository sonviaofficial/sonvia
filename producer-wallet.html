<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producer Wallet • SONVIA</title>
<link rel="stylesheet" href="style.css">

<style>
.wallet-page{
background:#050816;
color:white;
min-height:100vh;
padding-bottom:100px;
}

.header{
background:linear-gradient(180deg,#7C3AED,#1b132e);
padding:18px 20px 28px;
border-bottom-left-radius:26px;
border-bottom-right-radius:26px;
position:relative;
}

.header a{
position:absolute;
left:18px;
top:18px;
color:white;
text-decoration:none;
font-size:22px;
}

.header h3{
text-align:center;
margin:0;
padding-top:4px;
font-size:24px;
}

.container{
padding:20px;
padding-bottom:90px;
}

.wallet-card{
background:linear-gradient(135deg,#7C3AED,#5B21B6);
padding:22px;
border-radius:22px;
margin-bottom:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.wallet-label{
font-size:12px;
color:#E5E7EB;
opacity:.85;
}

.wallet-balance{
font-size:34px;
font-weight:bold;
margin:10px 0 20px;
}

.account-card{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.2);
padding:14px 16px;
border-radius:16px;
}

.account-card strong{
font-size:22px;
letter-spacing:2px;
}

.icon-copy{
width:42px;
height:42px;
border:none;
border-radius:12px;
background:white;
color:#7C3AED;
font-size:18px;
}

.locked-card{
background:#111827;
border:1px solid rgba(124,58,237,.35);
border-radius:20px;
padding:18px;
margin-bottom:20px;
}

.locked-balance{
font-size:26px;
font-weight:bold;
margin:8px 0;
}

.actions{
display:flex;
gap:10px;
margin-bottom:28px;
}

.actions button{
flex:1;
border:none;
border-radius:14px;
padding:13px 8px;
background:#7C3AED;
color:white;
font-weight:600;
}

#transactionsList{
background:#111827;
border-radius:20px;
padding:18px;
min-height:70px;
}

#transactionsList p{
color:#9CA3AF;
margin:0;
}
</style>
</head>

<body>

<div class="wallet-page">

<div class="header">
<a href="producer-dashboard.html">←</a>
<h3>Producer Wallet</h3>
</div>

<div class="container">

<div class="wallet-card">

<div class="wallet-label">Available Balance</div>

<div id="walletBalance" class="wallet-balance">
₦0.00
</div>

<div class="account-card">

<div>
<div class="wallet-label">SONVIA Account Number</div>
<strong id="accountNumber">00000000</strong>
</div>

<button id="copyAccount" class="icon-copy">📋</button>

</div>

</div>

<div id="lockedCard" class="locked-card" style="display:none;">

<div class="wallet-label">Locked Balance</div>

<div id="lockedBalance" class="locked-balance">₦0.00</div>

<small style="color:#9CA3AF;">
Waiting for the artist's 6-digit completion code.
</small>

</div>

<div class="actions">

<button onclick="location.href='deposit.html'">
Deposit
</button>

<button onclick="location.href='send-money.html'">
Send
</button>

<button id="withdrawBtn">
Withdraw
</button>

</div>

<h3>Recent Transactions</h3>

<div id="transactionsList">
<p>No transactions yet.</p>
</div>

</div>

</div>

<script type="module">

import { supabase } from "./supabase.js";

const { data:{ user } } =
await supabase.auth.getUser();

if(!user){
location.href="login.html";
throw new Error();
}

let { data:profile } =
await supabase
.from("profiles")
.select(`
role,
wallet_balance,
locked_balance,
wallet_account_number
`)
.eq("id",user.id)
.single();

if(profile.role!=="producer"){
location.href="artist-dashboard.html";
}

function money(amount){
return "₦"+Number(amount||0)
.toLocaleString(undefined,{
minimumFractionDigits:2,
maximumFractionDigits:2
});
}

if(!profile.wallet_account_number){

let account;

while(true){

account="0"+Math.floor(Math.random()*10000000)
.toString()
.padStart(7,"0");

const { data }=
await supabase
.from("profiles")
.select("id")
.eq("wallet_account_number",account);

if(!data.length) break;

}

await supabase
.from("profiles")
.update({
wallet_account_number:account
})
.eq("id",user.id);

profile.wallet_account_number=account;

}

document.getElementById("walletBalance").textContent=
money(profile.wallet_balance);

document.getElementById("accountNumber").textContent=
profile.wallet_account_number;

if(Number(profile.locked_balance)>0){

document.getElementById("lockedCard").style.display="block";

document.getElementById("lockedBalance").textContent=
money(profile.locked_balance);

}

document.getElementById("copyAccount")
.onclick=async()=>{

await navigator.clipboard.writeText(
profile.wallet_account_number
);

};

document.getElementById("withdrawBtn")
.onclick=()=>{

alert(
"Withdrawals will be available after producer earnings are enabled."
);

};

</script>

</body>
</html>
