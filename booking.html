<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONVIA – Book Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SONVIA</h1>
        <p>Book Your Studio Session</p>
    </header>

    <main>
        <section>
            <h2>Studio Booking</h2>

            <form>
                <input type="text" placeholder="Your Full Name" required>
                <input type="text" placeholder="Artist Name" required>

                <select required>
                    <option value="">Select Service</option>
                    <option>Vocal Recording – ₦50,000</option>
                    <option>Mixing – ₦15,000</option>
                    <option>Mastering – ₦10,000</option>
                </select>

                <input type="date" required>
                <input type="time" required>

                <a href="payment.html">
    <button type="button">Confirm Booking</button>
</a>
            </form>
        </section>
    </main>

</body>
</html>
