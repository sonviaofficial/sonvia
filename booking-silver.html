<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONVIA – Book Silver Beat Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SONVIA</h1>
        <p>Book Your Studio Session</p>
    </header>

    <main>
        <section>
            <h2>Studio Booking</h2>

            <p><strong>Studio:</strong> Silver Beat Studio</p>
            <p><strong>Location:</strong> Yaba, Lagos</p>

            <form>

                <input type="text" placeholder="Your Full Name" required>

                <input type="text" placeholder="Artist Name" required>

                <select required>
                    <option value="">Select Service</option>
                    <option>Vocal Recording – ₦60,000</option>
                    <option>Mixing – ₦20,000</option>
                    <option>Mastering – ₦12,000</option>
                </select>

                <input type="date" required>

                <input type="time" required>

                <a href="payment.html">
                    <button type="button">Confirm Booking</button>
                </a>

            </form>
        </section>
    </main>

</body>
</html>
