
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SONVIA – Reset Password</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>SONVIA</h1>
    <p>Create a new password</p>
</header>

<main>

    <section class="profile-card">

        <h2>🔐 Reset Password</h2>

        <p id="statusMessage">
            Enter your new password below.
        </p>

        <form id="updatePasswordForm">

            <input
                type="password"
                id="newPassword"
                placeholder="New Password"
                minlength="6"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm New Password"
                minlength="6"
                required
            >

            <button type="submit">
                Update Password
            </button>

        </form>

        <p id="message"></p>

    </section>

</main>

<script src="supabase.js"></script>

<script>

const form =
    document.getElementById("updatePasswordForm");

const message =
    document.getElementById("message");

const statusMessage =
    document.getElementById("statusMessage");


/*
    SUPABASE PASSWORD RECOVERY
*/

let recoveryReady = false;


/*
    Listen for the recovery session
*/

supabase.auth.onAuthStateChange(
    async function(event, session) {

        console.log("Supabase Auth Event:", event);

        if (event === "PASSWORD_RECOVERY" && session) {

            recoveryReady = true;

            statusMessage.textContent =
                "You can now create a new password.";

            console.log(
                "Password recovery session ready."
            );
        }

    }
);


/*
    Check whether a session already exists
*/

async function checkRecoverySession() {

    const {
        data,
        error
    } = await supabase.auth.getSession();


    if (error) {

        console.error(error);

        return;
    }


    if (data.session) {

        recoveryReady = true;

        statusMessage.textContent =
            "You can now create a new password.";

        console.log(
            "Recovery session found."
        );

    }

}


checkRecoverySession();


/*
    UPDATE PASSWORD
*/

form.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        const newPassword =
            document
                .getElementById("newPassword")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        /*
            CHECK PASSWORDS
        */

        if (newPassword !== confirmPassword) {

            message.textContent =
                "❌ Passwords do not match.";

            return;
        }


        if (newPassword.length < 6) {

            message.textContent =
                "❌ Password must be at least 6 characters.";

            return;
        }


        message.textContent =
            "Updating password...";


        try {

            /*
                Make sure recovery session exists
            */

            const {
                data: sessionData
            } = await supabase.auth.getSession();


            if (!sessionData.session) {

                message.textContent =
                    "❌ This password reset link has expired or is invalid. Please request a new reset link.";

                return;
            }


            /*
                UPDATE PASSWORD
            */

            const {
                error
            } = await supabase.auth.updateUser({

                password: newPassword

            });


            if (error) {

                console.error(
                    "Password update error:",
                    error
                );

                message.textContent =
                    "❌ " + error.message;

                return;
            }


            /*
                SUCCESS
            */

            message.textContent =
                "✅ Password updated successfully!";


            form.reset();


            /*
                GO TO LOGIN
            */

            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                2000
            );

        }

        catch (error) {

            console.error(
                "Unexpected error:",
                error
            );

            message.textContent =
    "❌ ERROR: " +
    (error.message ||
     JSON.stringify(error));

        }

    }
);

</script>

</body>
</html>
