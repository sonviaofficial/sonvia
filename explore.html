<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONVIA Explore</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="explore-header">
    <button class="back-btn" onclick="history.back()">
        ← Back
    </button>

    <button class="bell-btn">
        🔔
    </button>
</header>

<h2 class="explore-title">EXPLORE</h2>

<main class="explore-feed">

<div class="explore-card">

    <div class="explore-top">
        <a href="producer-profile.html">
            <img src="images/default-avatar.png" class="profile-pic">
        </a>

        <div>
            <div class="producer-name">
                FOSKY Studio
                <span class="verified-badge">✓</span>
            </div>
            <div class="producer-username">@foskystudio</div>
        </div>
    </div>

    <div class="video-container">

        <video class="studio-video" controls poster="images/studio-cover.jpg">
            <source src="videos/studio-demo.mp4" type="video/mp4">
        </video>

        <div class="video-actions">

            <button class="video-btn like-btn">♡</button>

            <button class="video-btn comment-btn">💬</button>

            <button class="video-btn share-btn">↗</button>

        </div>

    </div>

    <div class="studio-info">

        <div class="amount-label">Studio Amount</div>
        <div class="amount-price">₦60,000</div>

        <label class="beat-option">
            <input type="checkbox">
            Include Beat (+₦20,000)
        </label>

    </div>

    <div class="action-buttons">
        <button class="book-btn">Book Session</button>
        <button class="follow-btn">Follow</button>
    </div>

</div>

<div class="producer-tag">@foskystudio</div>

</div>

</div>

</div>

</main>

<nav class="bottom-nav">

<a href="artist-dashboard.html">
<span>⌂</span>
Home
</a>

<a href="explore.html" class="active">
<span>⌕</span>
Explore
</a>

<a href="post.html" class="post-btn">
+
</a>

<a href="my-bookings.html">
<span>🗓</span>
Bookings
</a>

<a href="profile.html">
<span>👤</span>
Profile
</a>

</nav>

</div>

</div>

<script>

const studioPrice=60000;
const beatPrice=20000;

const total=document.getElementById("studioTotal");
const beat=document.getElementById("includeBeat");

beat.addEventListener("change",()=>{

const amount=beat.checked
? studioPrice+beatPrice
: studioPrice;

total.textContent="₦"+amount.toLocaleString();

});

document.getElementById("producerAvatar")
.addEventListener("click",()=>{

window.location.href="profile.html";

});

let liked=false;

const likeBtn=document.getElementById("likeBtn");
const likeCount=document.getElementById("likeCount");

likeBtn.addEventListener("click",()=>{

liked=!liked;

if(liked){

likeBtn.firstChild.textContent="💜";
likeCount.textContent="1,201";

}else{

likeBtn.firstChild.textContent="🤍";
likeCount.textContent="1.2K";

}

});

const sheet=document.getElementById("commentSheet");

document.getElementById("commentBtn")
.addEventListener("click",()=>{

sheet.classList.add("show");

document.getElementById("commentInput").focus();

});

sheet.addEventListener("click",(e)=>{

if(e.target===sheet){

sheet.classList.remove("show");

}

});

document.getElementById("shareBtn")
.addEventListener("click",()=>{

if(navigator.share){

navigator.share({

title:"SONVIA",
text:"Check out this producer on SONVIA"

});

}

});

</script>

</body>
</html>
