<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONVIA Explore</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="feed-header">
<a href="artist-dashboard.html" class="back-btn">←</a>
<h1>Explore</h1>
</header>

<main class="feed-screen">

<div class="video-feed-card">

<div class="feed-top">

<img id="producerAvatar"
src="https://placehold.co/44x44/333/fff?text=S"
class="feed-avatar">

<div>
<div class="feed-name">
FOSKY Studio
<span class="verify-dot">✓</span>
</div>

<div class="feed-username">@foskystudio</div>
</div>

</div>

<div class="feed-video">

Studio Video Preview

<div class="floating-actions">

<button class="float-icon">
♡
<small>1.2K</small>
</button>

<button class="float-icon">
💬
<small>120</small>
</button>

<button class="float-icon">
↗
<small>Share</small>
</button>

</div>

</div>

<div class="price-card">

<div class="price-label">
Studio Amount
</div>

<div id="studioTotal" class="price-total">
₦60,000
</div>

<label class="beat-option">
<input type="checkbox" id="includeBeat">
<span>Include Beat (+₦20,000)</span>
</label>

</div>

<div class="feed-buttons">

<button class="book-btn">
Book Session
</button>

<button class="follow-btn">
Follow
</button>

</div>

</div>

</main>

<nav class="bottom-nav">

<a href="artist-dashboard.html">
<span>⌂</span>
Home
</a>

<a href="explore.html" class="active">
<span>⌕</span>
Explore
</a>

<a href="post.html" class="post-btn">
+
</a>

<a href="my-bookings.html">
<span>🗓</span>
Bookings
</a>

<a href="profile.html">
<span>👤</span>
Profile
</a>

</nav>

<script>
const studioPrice=60000;
const beatPrice=20000;

const total=document.getElementById("studioTotal");
const beat=document.getElementById("includeBeat");

beat.addEventListener("change",()=>{

const amount=beat.checked
? studioPrice+beatPrice
: studioPrice;

total.textContent="₦"+amount.toLocaleString();

});

document.getElementById("producerAvatar")
.addEventListener("click",()=>{

window.location.href="profile.html";

});
</script>

</body>
</html>
