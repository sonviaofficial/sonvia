<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SONVIA • Explore Producers</title>

<link rel="stylesheet" href="style.css">

<style>
body{
background:#0b0b0f;
color:white;
font-family:Arial,sans-serif;
margin:0;
}

.header{
display:flex;
align-items:center;
gap:15px;
padding:20px;
background:linear-gradient(180deg,#7C3AED,#1b132e);
}

.back{
color:white;
text-decoration:none;
font-size:26px;
}

.container{
padding:20px;
padding-bottom:100px;
}

.search{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#181824;
color:white;
margin-bottom:20px;
box-sizing:border-box;
}

.card{
background:#15151d;
padding:18px;
border-radius:18px;
margin-bottom:16px;
}

.price{
margin-top:14px;
padding:12px;
border-radius:12px;
background:#1b1b27;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#7C3AED;
color:white;
margin-top:16px;
}
</style>

</head>

<body>

<div class="header">

<a href="artist-dashboard.html" class="back">←</a>

<h2>Explore Producers</h2>

</div>

<div class="container">

<input
type="text"
class="search"
placeholder="Search producers (Coming Soon)">

<div class="card">

<strong>FOSKY Studio</strong>

<div
style="display:flex;align-items:center;gap:6px;color:#aaa;margin-top:8px;">

<svg width="18" height="18"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z"/>

<circle cx="12" cy="11" r="2"/>

</svg>

Ikorodu, Lagos

</div>

<div
style="display:flex;align-items:center;gap:6px;color:#8B5CF6;margin-top:8px;">

<svg width="18" height="18"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M20 6L9 17l-5-5"/>

</svg>

Verified Producer

</div>

<div class="price">

<div
style="font-size:12px;color:#aaa;">

Studio Amount

</div>

<div
style="font-size:22px;font-weight:bold;margin-top:4px;">

₦50,000

</div>

</div>

<button id="bookBtn">

Book Now

</button>

</div>

</div>

<script>

document
.getElementById("bookBtn")
.addEventListener("click",()=>{

alert(
`Booking Preview

Producer: FOSKY Studio

Studio Amount: ₦50,000

Location: Ikorodu, Lagos

Booking payments are coming soon.`
);

});

</script>

</body>
</html>
