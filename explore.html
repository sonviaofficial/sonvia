<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONVIA Explore</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="explore-header">

<a href="artist-dashboard.html" class="back-link">
← Back
</a>

<h1>Explore</h1>

</header>

<main class="explore-feed">

<div class="explore-card">

<div class="explore-top">

<img id="producerAvatar"
src="https://placehold.co/44x44/333/fff?text=S"
class="producer-avatar">

<div class="producer-info">

<div class="producer-name-row">

<strong>FOSKY Studio</strong>

<div class="verify-dot">✓</div>

</div>

<div class="producer-tag">@foskystudio</div>

</div>

</div>

<div class="video-area" id="videoArea">

<div class="video-actions">

<button id="likeBtn" class="icon-btn">
🤍
<small id="likeCount">1.2K</small>
</button>

<button id="commentBtn" class="icon-btn">
💬
<small>120</small>
</button>

<button id="shareBtn" class="icon-btn">
↗
<small>Share</small>
</button>

</div>

</div>

<div class="price-card">

<div class="price-label">
Studio Amount
</div>

<div id="studioTotal" class="price-total">
₦60,000
</div>

<label class="beat-option">

<input type="checkbox" id="includeBeat">

<span>Include Beat (+₦20,000)</span>

</label>

</div>

<div class="feed-buttons">

<button class="book-btn">
Book Session
</button>

<button class="follow-btn">
Follow
</button>

</div>

</div>

</main>

<nav class="bottom-nav">

<a href="artist-dashboard.html">
<span>⌂</span>
Home
</a>

<a href="explore.html" class="active">
<span>⌕</span>
Explore
</a>

<a href="post.html" class="post-btn">
+
</a>

<a href="my-bookings.html">
<span>🗓</span>
Bookings
</a>

<a href="profile.html">
<span>👤</span>
Profile
</a>

</nav>

<div id="commentSheet" class="comment-sheet">

<div class="comment-panel">

<div class="comment-bar"></div>

<h3>Comments</h3>

<div class="comment-list">

<div class="comment-item">
<strong>fosky.j</strong>
<p>Crazy setup 🔥</p>
</div>

</div>

<div class="comment-input">

<input
id="commentInput"
type="text"
placeholder="Write a comment...">

<button id="sendComment">
Send
</button>

</div>

</div>

</div>

<script>

const studioPrice=60000;
const beatPrice=20000;

const total=document.getElementById("studioTotal");
const beat=document.getElementById("includeBeat");

beat.addEventListener("change",()=>{

const amount=beat.checked
? studioPrice+beatPrice
: studioPrice;

total.textContent="₦"+amount.toLocaleString();

});

document.getElementById("producerAvatar")
.addEventListener("click",()=>{

window.location.href="profile.html";

});

let liked=false;

const likeBtn=document.getElementById("likeBtn");
const likeCount=document.getElementById("likeCount");

likeBtn.addEventListener("click",()=>{

liked=!liked;

if(liked){

likeBtn.firstChild.textContent="💜";
likeCount.textContent="1,201";

}else{

likeBtn.firstChild.textContent="🤍";
likeCount.textContent="1.2K";

}

});

const sheet=document.getElementById("commentSheet");

document.getElementById("commentBtn")
.addEventListener("click",()=>{

sheet.classList.add("show");

document.getElementById("commentInput").focus();

});

sheet.addEventListener("click",(e)=>{

if(e.target===sheet){

sheet.classList.remove("show");

}

});

document.getElementById("shareBtn")
.addEventListener("click",()=>{

if(navigator.share){

navigator.share({

title:"SONVIA",
text:"Check out this producer on SONVIA"

});

}

});

</script>

</body>
</html>
