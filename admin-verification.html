<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONVIA Admin</title>

<style>

body{
background:#0b0b0f;
color:white;
font-family:Arial,sans-serif;
margin:0;
}

.header{
padding:22px;
background:linear-gradient(180deg,#7C3AED,#171020);
font-size:22px;
font-weight:600;
}

.container{
padding:18px;
padding-bottom:80px;
}

.card{
background:#15151d;
border:1px solid #262632;
border-radius:18px;
padding:18px;
margin-bottom:15px;
}

.name{
font-size:18px;
font-weight:600;
margin-bottom:6px;
}

.small{
color:#999;
font-size:13px;
margin-bottom:6px;
}

.status{
display:inline-block;
padding:6px 12px;
border-radius:999px;
background:rgba(124,58,237,.15);
border:1px solid #7C3AED;
font-size:12px;
margin-top:8px;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
}

button{
flex:1;
padding:12px;
border:none;
border-radius:12px;
font-size:14px;
cursor:pointer;
}

.approve{
background:#16A34A;
color:white;
}

.reject{
background:#DC2626;
color:white;
}

.empty{
text-align:center;
color:#888;
padding:40px 0;
}

</style>
</head>

<body>

<div class="header">
🔐 SONVIA Admin
</div>

<div class="container" id="requests">

<div class="empty">
Loading verification requests...
</div>

</div>

<script type="module">

import { supabase } from './supabase.js';

const container=document.getElementById('requests');

async function loadAdmin(){

const {data:{user}}=await supabase.auth.getUser();

if(!user){

window.location.href='login.html';

return;

}

const {data:profile}=await supabase
.from('profiles')
.select('is_admin')
.eq('id',user.id)
.single();

if(!profile || profile.is_admin!==true){

window.location.href='artist-dashboard.html';

return;

}

loadRequests();

}

async function loadRequests() {
  container.innerHTML = '<div class="empty">Loading applications...</div>';

  const { data: requests, error } = await supabase
    .from('verification_requests')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    container.innerHTML = `
      <div class="empty">
        <strong>Unable to load applications</strong><br>
        ${error.message}
      </div>`;
    return;
  }

  if (!requests || requests.length === 0) {
    container.innerHTML =
      '<div class="empty">No applications submitted yet.</div>';
    return;
  }

  const userIds = [
    ...new Set(requests.map(r => r.user_id).filter(Boolean))
  ];

  let profiles = [];

  if (userIds.length) {
    const { data, error: profileError } = await supabase
      .from('profiles')
      .select('id, artist_name, full_name, username, role, is_verified')
      .in('id', userIds);

    if (profileError) {
      container.innerHTML = `
        <div class="empty">
          Applications loaded, but profiles could not be loaded.<br>
          ${profileError.message}
        </div>`;
      return;
    }

    profiles = data || [];
  }

  const profileMap = new Map(
    profiles.map(profile => [profile.id, profile])
  );

  container.innerHTML = '';

  requests.forEach(request => {
    const profile = profileMap.get(request.user_id) || {};
    const status = request.status || 'pending';

    const name =
      profile.artist_name ||
      profile.full_name ||
      profile.username ||
      'Unknown User';

    const card = document.createElement('div');
    card.className = 'card';

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = name;

    const usernameEl = document.createElement('div');
    usernameEl.className = 'small';
    usernameEl.textContent = '@' + (profile.username || 'user');

    const roleEl = document.createElement('div');
    roleEl.className = 'small';
    roleEl.textContent = 'Role: ' + (profile.role || 'user');

    const amountEl = document.createElement('div');
    amountEl.className = 'small';
    amountEl.textContent =
      'Application fee: ₦' + (request.payment_amount ?? 5000);

    const statusEl = document.createElement('div');
    statusEl.className = 'status';
    statusEl.textContent = 'Status: ' + status;

    card.append(nameEl, usernameEl, roleEl, amountEl, statusEl);

    if (status.toLowerCase() === 'pending') {
      const actions = document.createElement('div');
      actions.className = 'actions';

      const approveButton = document.createElement('button');
      approveButton.className = 'approve';
      approveButton.textContent = 'Approve';
      approveButton.onclick = () =>
        approve(request.id, request.user_id);

      const rejectButton = document.createElement('button');
      rejectButton.className = 'reject';
      rejectButton.textContent = 'Reject';
      rejectButton.onclick = () => reject(request.id);

      actions.append(approveButton, rejectButton);
      card.appendChild(actions);
    }

    container.appendChild(card);
  });
}

async function approve(requestId, userId) {
  if (!confirm('Approve this verification application?')) return;

  if (!userId) {
    alert('Cannot approve: applicant user ID is missing.');
    return;
  }

  const { data: request, error: requestError } = await supabase
    .from('verification_requests')
    .update({ status: 'approved' })
    .eq('id', requestId)
    .eq('status', 'pending')
    .select('id')
    .maybeSingle();

  if (requestError || !request) {
    alert(
      'Could not approve this application. ' +
      (requestError?.message || 'It may no longer be pending.')
    );
    return;
  }

  const { error: profileError } = await supabase
    .from('profiles')
    .update({ is_verified: true })
    .eq('id', userId);

  if (profileError) {
    await supabase
      .from('verification_requests')
      .update({ status: 'pending' })
      .eq('id', requestId)
      .eq('status', 'approved');

    alert(
      'Profile verification failed. ' +
      profileError.message
    );
    await loadRequests();
    return;
  }

  alert('Application approved and verified badge enabled.');
  await loadRequests();
}

async function reject(requestId) {
  if (!confirm('Reject this verification application?')) return;

  const { data, error } = await supabase
    .from('verification_requests')
    .update({ status: 'rejected' })
    .eq('id', requestId)
    .eq('status', 'pending')
    .select('id')
    .maybeSingle();

  if (error || !data) {
    alert(
      'Could not reject this application. ' +
      (error?.message || 'It may no longer be pending.')
    );
    return;
  }

  alert('Application rejected.');
  await loadRequests();
}
  

loadAdmin();

</script>

</body>
</html>
