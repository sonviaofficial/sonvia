<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONVIA Comments</title>
<link rel="stylesheet" href="style.css">
<style>

body{
background:#050816;
color:white;
margin:0;
font-family:Arial,sans-serif;
}

.header{
display:flex;
align-items:center;
gap:14px;
padding:16px;
background:#111827;
border-bottom:1px solid #243041;
}

.header a{
color:white;
text-decoration:none;
font-size:15px;
}

.comments{
padding:18px;
padding-bottom:90px;
}

.comment{
display:flex;
gap:12px;
margin-bottom:22px;
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
background:#333;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.name-row{
display:flex;
align-items:center;
gap:6px;
}

.verify-dot{
width:16px;
height:16px;
background:#7C3AED;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:9px;
}

.role{
font-size:12px;
color:#9ca3af;
margin-top:2px;
}

.comment-text{
margin-top:6px;
line-height:1.5;
}

.actions{
display:flex;
gap:20px;
margin-top:8px;
font-size:13px;
color:#9ca3af;
}

.actions button{
background:none;
border:none;
color:#9ca3af;
padding:0;
margin:0;
width:auto;
cursor:pointer;
}

.reply{
margin-left:54px;
margin-top:12px;
display:flex;
gap:10px;
}

.reply .avatar{
width:34px;
height:34px;
}

.input-bar{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111827;
padding:14px;
display:flex;
gap:10px;
border-top:1px solid #243041;
}

.input-bar input{
flex:1;
background:#1f2937;
border:none;
border-radius:999px;
padding:14px;
color:white;
}

.input-bar button{
width:auto;
padding:0 20px;
}

</style>
</head>

<body>

<div class="header">

<a href="explore.html">← Back</a>

<h2>Comments</h2>

</div>

<div class="comments">

<div class="comment">

<div class="avatar" onclick="openProfile()">
F
</div>

<div>

<div class="name-row">

<strong>fosky.j</strong>

<div class="verify-dot">✓</div>

</div>

<div class="role">
Artist
</div>

<div class="comment-text">
Crazy setup 🔥
</div>

<div class="actions">

<button onclick="toggleLike(this)">🤍 12</button>

<button>Reply</button>

</div>

</div>

</div>

<div class="reply">

<div class="avatar" onclick="openProfile()">
L
</div>

<div>

<div class="name-row">

<strong>Lizzy</strong>

</div>

<div class="role">
Artist
</div>

<div class="comment-text">
This studio go mad 😭
</div>

<div class="actions">

<button onclick="toggleLike(this)">🤍 3</button>

</div>

</div>

</div>

</div>

<div class="input-bar">

<input
id="commentInput"
placeholder="Write a comment...">

<button onclick="sendComment()">
Send
</button>

</div>

<script>

function openProfile(){

window.location.href="profile.html";

}

function toggleLike(btn){

if(btn.textContent.includes("🤍")){

btn.textContent=btn.textContent.replace("🤍","💜");

}else{

btn.textContent=btn.textContent.replace("💜","🤍");

}

}

function sendComment(){

const input=document.getElementById("commentInput");

if(!input.value.trim())return;

alert("Comment posted.");

input.value="";

}

</script>

</body>
</html>
