<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONVIA • Wallet</title>

<link rel="stylesheet" href="style.css">

<style>
body{
background:#0b0b0f;
color:white;
font-family:Arial,sans-serif;
margin:0;
}
.header{
display:flex;
align-items:center;
gap:15px;
padding:20px;
background:linear-gradient(180deg,#7C3AED,#1b132e);
}
.back{
color:white;
text-decoration:none;
font-size:26px;
}
.container{
padding:20px;
padding-bottom:100px;
}
.balance{
background:linear-gradient(135deg,#7C3AED,#3B0A73);
padding:24px;
border-radius:20px;
text-align:center;
margin-bottom:20px;
}
.balance small{
opacity:.8;
}
.balance h1{
margin:8px 0 0;
font-size:36px;
}
.card{
background:#15151d;
padding:18px;
border-radius:18px;
}
button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#2b2b35;
color:white;
margin-top:12px;
cursor:not-allowed;
}
.note{
color:#aaa;
font-size:13px;
margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
<a href="artist-dashboard.html" class="back">←</a>
<h2>Wallet</h2>
</div>

<div class="container">

<div class="balance">
<small>Available Balance</small>
<h1>₦0</h1>
</div>

<div class="card">

<h3>Wallet Coming Soon</h3>

<p>Payments, deposits, withdrawals, and SONVIA earnings will appear here.</p>

<button disabled>Deposit</button>

<button disabled>Withdraw</button>

<p class="note">
Wallet features will unlock when booking payments go live.
</p>

</div>

</div>

</body>
</html>
